name: Add Anti-Gambling Trader
on:
  push:
    paths: ['.github/workflows/add-anti-gambling-trader.yml']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: main}
      - name: Add catalog entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d='2026-08-28'; rp=Path('data/resources.json'); ip=Path('data/resource-icons.json')
          r=json.loads(rp.read_text()); i=json.loads(ip.read_text())
          x={
            'id':'anti-gambling-trader-tw','name':'反詐投資王','type':'github','url':'https://github.com/mars-tw/anti-gambling-trader-tw',
            'categories':['Finance / Crypto','Data / Analytics','Security / Reverse Engineering','Developer Tools','Learning / Documentation'],
            'tags':['trading-analysis','anti-scam','statistics','backtesting','paper-trading','risk-management','taiwan-stocks','us-stocks','crypto','forex','line-chat','local-first','python'],
            'summary':'免費開源的交易統計與投資反詐工具，用期望值、顯著性檢定、Bootstrap 與樣本外驗證判斷獲利更像可重複優勢還是運氣，也提供詐騙話術掃描、假績效鑑識與交易風險分析。',
            'use_cases':['匯入台股、美股、加密貨幣或外匯交易紀錄，分析勝率、盈虧比、期望值、回撤與風險指標','檢查投資群組、帶單老師、假績效截圖與保證獲利話術是否有高風險徵兆','以統計顯著性與樣本外驗證檢查交易策略是否可能只是過度配適或倖存者偏差','產生可回測策略骨架、PaperBroker 紙上交易與自動化交易專案腳架','在本機處理交易分析資料，降低把個人交易紀錄上傳第三方服務的需求'],
            'pricing':'open-source','open_source':True,'license':'MIT','difficulty':'intermediate','status':'active','rating':5,'added_at':d,'last_checked':d,
            'notes':'支援台股、台股 ETF、台指期／選擇權、美股、加密貨幣與外匯；可匯入 CSV、JSON、Excel。另含反詐掃描、LINE 對話掃描、交易截圖 OCR、風險模擬與自動化交易腳架。預設歷史 runner 不送真單；真實交易需自行完成券商 API、live runner 與安全解鎖。'
          }
          a=r['resources']; k=next((n for n,v in enumerate(a) if v.get('id')==x['id'] or v.get('url')==x['url']),None)
          a.append(x) if k is None else a.__setitem__(k,x); r['updated_at']=d
          i.setdefault('icons',{})[x['id']]={'url':'https://github.com/mars-tw.png?size=256','source':'github-owner-avatar-256-fallback-no-project-logo'}; i['updated_at']=d
          rp.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n'); ip.write_text(json.dumps(i,ensure_ascii=False,indent=2)+'\n')
          assert sum(v.get('id')==x['id'] for v in a)==1
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json
          git diff --cached --quiet || (git commit -m 'Add Anti-Gambling Trader resource' && git push origin HEAD:main)
