name: Temporary AI Token King ingestion helper

on:
  push:
    branches:
      - data/add-aitokenking-developer-skills-20260902

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.head_commit.message == 'Stage AI Token King ingestion helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: data/add-aitokenking-developer-skills-20260902
      - name: Add verified resource metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          resource_id = "firekou-aitokenking-developerskill"
          canonical_url = "https://github.com/firekou/aitokenking_developerskill"
          today = "2026-09-02"

          resources_path = Path("data/resources.json")
          icons_path = Path("data/resource-icons.json")
          links_path = Path("data/resource-links.json")
          categories_path = Path("data/categories.json")

          resources_doc = json.loads(resources_path.read_text(encoding="utf-8"))
          icons_doc = json.loads(icons_path.read_text(encoding="utf-8"))
          links_doc = json.loads(links_path.read_text(encoding="utf-8"))
          categories_doc = json.loads(categories_path.read_text(encoding="utf-8"))

          if any(r.get("id") == resource_id for r in resources_doc["resources"]):
              raise SystemExit(f"duplicate resource id: {resource_id}")
          if any(r.get("url", "").rstrip("/").lower() == canonical_url.rstrip("/").lower() for r in resources_doc["resources"]):
              raise SystemExit(f"duplicate canonical URL: {canonical_url}")
          if resource_id in icons_doc["icons"] or resource_id in links_doc["links"]:
              raise SystemExit(f"supplemental registry already contains {resource_id}")

          categories = [
              "Agent Skills",
              "AI Coding",
              "MCP / Agent Frameworks",
              "Testing / QA",
              "Automation / Workflow",
              "Developer Tools",
          ]
          known_categories = {item["name"] for item in categories_doc["categories"]}
          missing = [name for name in categories if name not in known_categories]
          if missing:
              raise SystemExit(f"unknown categories: {missing}")

          resources_doc["resources"].append({
              "id": resource_id,
              "name": "AI Token King Developer Skills",
              "type": "github",
              "url": canonical_url,
              "categories": categories,
              "tags": [
                  "aitokenking",
                  "developer-skills",
                  "agent-skills",
                  "claude-code",
                  "mcp",
                  "vibe-to-ship",
                  "tdd",
                  "spec-grooming",
                  "architecture-guard",
                  "multi-model",
                  "openai-compatible",
                  "python",
              ],
              "summary": "MIT 開源的 AI Coding 工程流程 Skill 集群，主要給 Claude Code 與支援 MCP 的 Agent 使用，把一句話需求依序轉成 Repository 勘查、規格細化、任務分解、TDD 實作與架構放行，讓需求到可合併改動之間有明確 Gate 與證據鏈。",
              "use_cases": [
                  "用 /vibe-to-ship 把一句話功能需求拆成可驗收、可測試、可放行的完整工程流程",
                  "用 repo-recon、spec-groom、plan-decompose 建立現況基線、驗收條件、非目標與相依任務圖",
                  "用 tdd-enforce 與 arch-guard 保留紅綠重構證據，檢查超譯、架構漂移與測試完整性再決定是否合併",
                  "透過 MCP 或 OpenAI-compatible API 串接多模型 Gateway，並在第一次使用時先以乾跑模式估算扣費呼叫與預計修改檔案",
              ],
              "pricing": "open-source",
              "open_source": True,
              "license": "MIT",
              "difficulty": "advanced",
              "status": "active",
              "rating": 4,
              "added_at": today,
              "last_checked": today,
              "notes": "Repository 於 2026-08-28 建立，2026-09-02 檢查時公開、未封存且近期仍有更新，屬早期專案。LICENSE 內文明確採 MIT；GitHub API 因授權檔附有額外來源說明而顯示 NOASSERTION，因此 catalog 以實際 LICENSE 文字為依據。預設多模型 Gateway 為 AI Token King，需要以環境變數 AITK_API_KEY 提供金鑰；部分 Skill 會進行扣費模型呼叫，/vibe-to-ship 與 tdd-enforce 也可能修改並提交專案程式碼，第一次使用建議先走不扣費、不改檔的乾跑路線。README 亦說明可把 AITK_BASE_URL 改指向其他 OpenAI-compatible endpoint。其研究掃描、效果敘述與流程價值主要來自專案自身文件，目前不應視為已由 Qookey 獨立實跑驗證。現行 default branch 名稱仍是 claude/ai-token-king-dev-skills-hs56n1，顯示 Repository 治理仍在早期整理階段。"
          })

          icons_doc["icons"][resource_id] = {
              "url": "https://github.com/firekou.png?size=256",
              "source": "github-owner-avatar-256-fallback-no-project-logo",
          }

          links_doc["links"][resource_id] = [
              {
                  "label": "Developer Skills Architecture",
                  "kind": "documentation",
                  "url": "https://github.com/firekou/aitokenking_developerskill/blob/claude/ai-token-king-dev-skills-hs56n1/ARCHITECTURE.md",
                  "description": "官方架構文件，說明 L0–L5 Skill 分層、Handoff 契約、Gate、可變更範圍與整體需求到合併流程。",
              },
              {
                  "label": "vibe-to-ship SKILL.md",
                  "kind": "documentation",
                  "url": "https://github.com/firekou/aitokenking_developerskill/blob/claude/ai-token-king-dev-skills-hs56n1/.claude/skills/vibe-to-ship/SKILL.md",
                  "description": "官方主入口 Skill 定義，涵蓋執行前置、乾跑路線、扣費與修改程式碼邊界，以及 L1–L5 的完整編排流程。",
              },
          ]

          resources_doc["updated_at"] = today
          icons_doc["updated_at"] = today
          links_doc["updated_at"] = today

          ids = [r["id"] for r in resources_doc["resources"]]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate resource IDs after update")
          urls = [r["url"].rstrip("/").lower() for r in resources_doc["resources"]]
          if len(urls) != len(set(urls)):
              raise SystemExit("duplicate canonical URLs after update")
          if len(resources_doc["resources"]) != 48:
              raise SystemExit(f"expected 48 resources, got {len(resources_doc['resources'])}")

          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          links_path.write_text(json.dumps(links_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python -m json.tool data/resources.json >/dev/null
          python -m json.tool data/resource-icons.json >/dev/null
          python -m json.tool data/resource-links.json >/dev/null
          python scripts/resource_links_validate.py

          git config user.name qookey-resource-bot
          git config user.email qookey-resource-bot@users.noreply.github.com
          git add data/resources.json data/resource-icons.json data/resource-links.json
          git commit -m "Add AI Token King Developer Skills resource"
          git push origin HEAD:data/add-aitokenking-developer-skills-20260902
