                  {'label': 'Flowsint README', 'kind': 'documentation', 'url': 'https://github.com/reconurge/flowsint/blob/main/README.md', 'description': '官方安裝、Enrichers、架構與安全部署說明。'},
                  {'label': 'Flowsint Ethics', 'kind': 'documentation', 'url': 'https://github.com/reconurge/flowsint/blob/main/ETHICS.md', 'description': '官方合法與倫理使用規範。'},
                  {'label': 'Flowsint License', 'kind': 'documentation', 'url': 'https://github.com/reconurge/flowsint/blob/main/LICENSE', 'description': '官方 Apache-2.0 License。'}
              ],
              'nangohq-nango': [
                  {'label': 'Nango Docs', 'kind': 'documentation', 'url': 'https://nango.dev/docs/', 'description': '官方 Auth、Proxy、Functions、Sync、Webhook 與 MCP 文件。'},
                  {'label': 'Nango Integrations', 'kind': 'documentation', 'url': 'https://nango.dev/docs/integrations/overview/', 'description': '官方 1,000+ API integrations 索引。'},
                  {'label': 'Nango README', 'kind': 'documentation', 'url': 'https://github.com/NangoHQ/nango/blob/master/README.md', 'description': '官方平台能力、AI Builder、自架與方案差異說明。'},
                  {'label': 'Nango License', 'kind': 'documentation', 'url': 'https://github.com/NangoHQ/nango/blob/master/LICENSE', 'description': '官方 Elastic License。'}
              ]
          }
          links_changed = False
          for resource_id, entries in link_updates.items():
              if resource_id not in links:
                  links[resource_id] = entries
                  links_changed = True
          if links_changed:
              links_doc['updated_at'] = TODAY
              links_path.write_text(json.dumps(links_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status_text = status_path.read_text(encoding='utf-8')
          status_text = re.sub(r'^Status date:\s*.*$', f'Status date: {TODAY} (Asia/Taipei)', status_text, count=1, flags=re.MULTILINE)
          catalog_count = len(resources)
          status_text = re.sub(r'- Current canonical catalog size: \*\*\d+ resources\*\*', f'- Current canonical catalog size: **{catalog_count} resources**', status_text, count=1)
          status_text = re.sub(r'- \d+ canonical resources are currently present in `data/resources\.json`\.', f'- {catalog_count} canonical resources are currently present in `data/resources.json`.', status_text, count=1)

          summaries = [
              '- MiroFish (`666ghj/MiroFish`) — AGPL-3.0 multi-agent swarm-intelligence simulation / prediction sandbox; treat outputs as scenario simulation rather than validated forecasts.',
              '- TradingAgents (`TauricResearch/TradingAgents`) — Apache-2.0 multi-agent financial research framework with analyst, debate, trader, risk and portfolio-manager roles; research-only, not investment advice.',
              '- LibreChat (`danny-avila/LibreChat`) — MIT self-hosted multi-model AI chat and agent platform with MCP, Skills, Code Interpreter and multi-user controls.',
              '- HyperFrames (`heygen-com/hyperframes`) — Apache-2.0 deterministic HTML/CSS/media-to-MP4 framework with agent skills and programmable video workflows.',
              '- Fincept Terminal (`Fincept-Corporation/FinceptTerminal`) — AGPL-3.0 open financial research terminal; separate proprietary Enterprise edition exists.',
              '- Agentic Inbox (`cloudflare/agentic-inbox`) — Apache-2.0 Cloudflare Workers email client with Workers AI agent, Durable Objects, R2 and MCP.',
              '- VoxCPM (`OpenBMB/VoxCPM`) — Apache-2.0 multilingual TTS, Voice Design and consent-sensitive Voice Cloning stack.',
              '- Flowsint (`reconurge/flowsint`) — Apache-2.0 local-first OSINT graph investigation platform with explicit ethical-use restrictions.',
              '- Nango (`NangoHQ/nango`) — API integration platform for Auth, Proxy, Sync, Webhooks, Actions and MCP; source-available under Elastic License rather than OSI open source.'
          ]
          missing = [line for line in summaries if line.split(' (`',1)[0][2:] not in status_text]
          if missing:
              heading = '## Recent verified ingestion / refresh baseline\n\n'
              status_text = status_text.replace(heading, heading + '\n'.join(missing) + '\n', 1)
          status_path.write_text(status_text, encoding='utf-8')

          print(f"added={added}")
          print(f"catalog_count={catalog_count}")
          PY

      - name: Validate catalog and status
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/resources.json >/dev/null
          python -m json.tool data/resource-icons.json >/dev/null
          python -m json.tool data/resource-links.json >/dev/null
          python scripts/project_status_consistency.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run resource detail regressions
        run: npm run test:browser

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/resources.json data/resource-icons.json data/resource-links.json PROJECT_STATUS.md; then
            echo 'Requested resources are already present and synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json data/resource-links.json PROJECT_STATUS.md
          git commit -m 'Add verified AI and developer resource batch'
          git push origin HEAD:main
