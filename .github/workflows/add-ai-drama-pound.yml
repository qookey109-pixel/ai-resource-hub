name: Add AI Drama Pound Resource

on:
  push:
    paths:
      - '.github/workflows/add-ai-drama-pound.yml'

permissions:
  contents: write

jobs:
  add-resource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Add resource, category, and icon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          today = '2026-08-28'

          resources_path = Path('data/resources.json')
          categories_path = Path('data/categories.json')
          icons_path = Path('data/resource-icons.json')

          resources = json.loads(resources_path.read_text(encoding='utf-8'))
          categories = json.loads(categories_path.read_text(encoding='utf-8'))
          icons = json.loads(icons_path.read_text(encoding='utf-8'))

          category = {
              'id': 'writing-screenwriting',
              'name': 'Writing / Screenwriting',
              'display_name': '寫作 / 編劇',
              'icon': '✍️'
          }
          if not any(item.get('name') == category['name'] for item in categories.get('categories', [])):
              categories.setdefault('categories', []).insert(-1, category)
          categories['updated_at'] = today

          resource = {
              'id': 'ai-drama-pound',
              'name': 'AI 短劇編劇',
              'type': 'github',
              'url': 'https://github.com/POUND0423/AI-drama-pound',
              'categories': [
                  'Agent Skills',
                  'Writing / Screenwriting',
                  'Video Generation / Editing',
                  'Learning / Documentation'
              ],
              'tags': [
                  'agent-skill',
                  'screenwriting',
                  'short-drama',
                  'vertical-video',
                  'storytelling',
                  'scriptwriting',
                  'dialogue',
                  'story-structure',
                  'codex',
                  'traditional-chinese'
              ],
              'summary': '繁體中文 AI 短劇編劇 Agent Skill，將故事前提與製作限制整理成可拍攝的短篇／豎屏短劇，涵蓋選題、角色、結構、分場、臺詞、衝突、反轉、格式與修改流程。',
              'use_cases': [
                  '讓 Codex 或其他支援 standalone skills 的 Agent 規劃與撰寫短篇／豎屏短劇',
                  '依集數、時長、平台、預算與場景限制建立角色關係、全劇節拍與單集劇本',
                  '針對臺詞、衝突、反轉、鉤子或格式做單點修改，不必重做整個劇本',
                  '先完成可拍攝劇本，再銜接環境中其他分鏡或 AI 影片提示詞 Skill'
              ],
              'pricing': 'open-source',
              'open_source': True,
              'license': 'MIT',
              'difficulty': 'intermediate',
              'status': 'active',
              'rating': 5,
              'added_at': today,
              'last_checked': today,
              'notes': 'README 明確定位為 standalone ai-short-drama-screenwriter Skill，可供 ChatGPT 桌面版 Codex、Codex CLI 與 IDE extension 使用，並提供完整八階段編劇流程、格式規則、審閱清單與驗證結果。專案採 MIT License。它本身不包含逐鏡分鏡或影片模型提示詞 Skill，混合交付需由其他已安裝技能接手。'
          }

          existing = resources.setdefault('resources', [])
          if not any(item.get('id') == resource['id'] or item.get('url') == resource['url'] for item in existing):
              existing.append(resource)
          resources['updated_at'] = today

          icons.setdefault('icons', {})['ai-drama-pound'] = {
              'url': 'https://github.com/POUND0423.png?size=256',
              'source': 'github-owner-avatar-256-fallback-no-project-logo'
          }
          icons['updated_at'] = today

          resources_path.write_text(json.dumps(resources, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          categories_path.write_text(json.dumps(categories, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          icons_path.write_text(json.dumps(icons, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON and resource
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          for path in ['data/resources.json', 'data/categories.json', 'data/resource-icons.json']:
              json.load(open(path, encoding='utf-8'))
          resources = json.load(open('data/resources.json', encoding='utf-8'))
          assert any(r.get('id') == 'ai-drama-pound' for r in resources['resources'])
          categories = json.load(open('data/categories.json', encoding='utf-8'))
          assert any(c.get('name') == 'Writing / Screenwriting' for c in categories['categories'])
          icons = json.load(open('data/resource-icons.json', encoding='utf-8'))
          assert 'ai-drama-pound' in icons['icons']
          print('validation passed')
          PY

      - name: Commit resource
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/resources.json data/categories.json data/resource-icons.json; then
            echo 'Resource already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json data/categories.json data/resource-icons.json
          git commit -m 'Add AI short drama screenwriter skill'
          git push origin HEAD:main
