name: One-off Retry Agent Resource Batch 2026-09-03B

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-retry-agent-batch-20260903b.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-run corrected catalog updater
        shell: bash
        run: |
          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path
          path = Path('.github/workflows/one-off-add-agent-batch-20260903b.yml')
          text = path.read_text(encoding='utf-8').replace('"kind": "package"', '"kind": "website"')
          match = re.search(r"python - <<'PY'\n(.*?)\n\s+PY\n", text, re.S)
          if not match:
              raise SystemExit('catalog updater block not found')
          code = textwrap.dedent(match.group(1))
          exec(compile(code, '<catalog-updater>', 'exec'))
          PY

      - name: Validate catalog and secondary links
        run: |
          python scripts/resource_health.py --validate-only
          python scripts/resource_links_validate.py
          python scripts/resource_health_triage.py --validate-only

      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run frontend interaction regression
        run: npm run test:browser

      - name: Commit catalog batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/resource-icons.json data/resource-links.json
          git diff --cached --quiet && { echo "No catalog changes"; exit 1; }
          git commit -m "Add code intelligence and agent workflow resources"
          git push origin HEAD:main
