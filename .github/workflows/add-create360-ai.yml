name: Add Create360 AI

on:
  push:
    paths:
      - '.github/workflows/add-create360-ai.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Add Create360.ai to catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          resources_path = Path('data/resources.json')
          icons_path = Path('data/resource-icons.json')

          data = json.loads(resources_path.read_text(encoding='utf-8'))
          resources = data.setdefault('resources', [])
          entry = {
              'id': 'create360-ai',
              'name': 'Create360.ai',
              'type': 'website',
              'url': 'https://create360.ai',
              'categories': [
                  'Scraping / Data Collection',
                  'MCP / Agent Frameworks',
                  'Developer Tools',
                  'Search / Research'
              ],
              'tags': [
                  'web-reader', 'markdown', 'url-fetcher', 'web-scraping',
                  'mcp', 'agent', 'content-extraction', 'research'
              ],
              'summary': '把公開網頁 URL 即時轉成乾淨 Markdown 內容的網頁讀取服務，適合 AI Agent、MCP、研究與資料擷取流程取得較容易閱讀與處理的文字。',
              'use_cases': [
                  '把公開網頁轉成適合 LLM 或 Agent 使用的 Markdown',
                  '替 MCP / AI Agent 補充公開網站內容擷取能力',
                  '將技術文件、新聞與一般網頁整理成乾淨文字',
                  '作為研究、摘要與資料蒐集流程的網頁 reader'
              ],
              'pricing': 'unknown',
              'open_source': None,
              'license': None,
              'difficulty': 'beginner',
              'status': 'active',
              'rating': 4,
              'added_at': '2026-08-28',
              'last_checked': '2026-08-28',
              'notes': '近期公開專案仍使用 Create360.ai 作為 Markdown reader；另有 MCP 套件可透過此服務擷取公開 URL。官網目前無法被檢索器穩定讀取，因此服務本身的價格與授權條款暫標待確認；具反爬保護的網站可能無法擷取。'
          }

          existing = next((r for r in resources if r.get('id') == entry['id'] or r.get('url', '').rstrip('/') == entry['url'].rstrip('/')), None)
          if existing:
              existing.update(entry)
          else:
              resources.append(entry)
          data['updated_at'] = '2026-08-28'
          resources_path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          icons = json.loads(icons_path.read_text(encoding='utf-8'))
          icons.setdefault('icons', {})['create360-ai'] = {
              'url': 'https://www.google.com/s2/favicons?sz=128&domain_url=https://create360.ai',
              'source': 'domain-favicon-128-fallback'
          }
          icons['updated_at'] = '2026-08-28'
          icons_path.write_text(json.dumps(icons, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate JSON and entry
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/resources.json >/dev/null
          python -m json.tool data/resource-icons.json >/dev/null
          grep -q 'create360-ai' data/resources.json
          grep -q 'create360-ai' data/resource-icons.json

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json
          if git diff --cached --quiet; then
            echo 'Create360.ai already up to date.'
            exit 0
          fi
          git commit -m 'Add Create360.ai resource'
          git push origin HEAD:main
