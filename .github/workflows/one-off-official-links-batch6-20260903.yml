name: One-off Official Links Batch 6 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-official-links-batch6-20260903.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add Official Links Batch 6
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          links_path = Path("data/resource-links.json")
          resources_path = Path("data/resources.json")
          links_doc = json.loads(links_path.read_text(encoding="utf-8"))
          resources_doc = json.loads(resources_path.read_text(encoding="utf-8"))
          resource_ids = {r["id"] for r in resources_doc["resources"]}
          links = links_doc.setdefault("links", {})

          batch = {
            "groqcloud-console": [
              {
                "label": "Groq API Quickstart",
                "kind": "documentation",
                "url": "https://console.groq.com/docs/quickstart",
                "description": "Groq 官方 API 入門文件，包含 API Key 環境變數、SDK 安裝與第一個請求範例。"
              },
              {
                "label": "Groq 支援模型",
                "kind": "documentation",
                "url": "https://console.groq.com/docs/models",
                "description": "官方目前可用 Production／Preview Models 與 Model ID、Context、價格及能力資訊。"
              },
              {
                "label": "Groq Rate Limits",
                "kind": "documentation",
                "url": "https://console.groq.com/docs/rate-limits",
                "description": "官方 Rate Limit 文件，說明 RPM、RPD、TPM、TPD 等限制與 429／Header 行為。"
              }
            ],
            "oracle-cloud-free-tier": [
              {
                "label": "OCI Free Tier 官方文件",
                "kind": "documentation",
                "url": "https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier.htm",
                "description": "Oracle 官方 Free Tier 文件，說明 Free Trial、Always Free、Home Region 與帳戶限制。"
              },
              {
                "label": "OCI Always Free Resources",
                "kind": "documentation",
                "url": "https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm",
                "description": "Oracle 官方 Always Free 資源清單與 Compute、Storage、Database、Networking 等額度說明。"
              }
            ],
            "openstreetmap": [
              {
                "label": "OpenStreetMap API v0.6",
                "kind": "api",
                "url": "https://wiki.openstreetmap.org/wiki/Api06",
                "description": "OpenStreetMap 官方 Wiki 的 Editing API v0.6 文件；大量唯讀資料用途應改用適合的下載或查詢服務。"
              },
              {
                "label": "OSM Tile Usage Policy",
                "kind": "documentation",
                "url": "https://operations.osmfoundation.org/policies/tiles/",
                "description": "OSMF 官方圖磚使用政策，涵蓋 attribution、User-Agent、快取、批次下載與服務限制。"
              },
              {
                "label": "OSM Nominatim Usage Policy",
                "kind": "documentation",
                "url": "https://operations.osmfoundation.org/policies/nominatim/",
                "description": "OSMF 官方地理編碼服務使用政策，說明公開 Nominatim 服務的流量與識別要求。"
              }
            ],
            "anti-gambling-trader-tw": [
              {
                "label": "反詐投資王官方 GitHub Pages",
                "kind": "demo",
                "url": "https://mars-tw.github.io/anti-gambling-trader-tw/",
                "description": "Repository metadata 指定的官方 GitHub Pages 入口，可快速查看專案功能與使用方式。"
              }
            ]
          }

          for rid, items in batch.items():
            assert rid in resource_ids, f"unknown resource id: {rid}"
            assert rid not in links, f"Batch 6 target already has supplemental links: {rid}"
            links[rid] = items

          links_doc["updated_at"] = "2026-09-03"
          links_path.write_text(json.dumps(links_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for rid, items in batch.items():
            assert len(links[rid]) == len(items)
            assert all(item["url"].startswith("https://") for item in links[rid])
          print("Official Links Batch 6 added:", sum(map(len, batch.values())), "links across", len(batch), "resources")
          PY

      - name: Validate catalog and supplemental links
        run: |
          python scripts/resource_health.py --validate-only
          python scripts/resource_links_validate.py
          python scripts/resource_health_triage.py --validate-only

      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run frontend interaction regression
        run: npm run test:browser

      - name: Commit Official Links Batch 6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resource-links.json
          git diff --cached --quiet && exit 0
          git commit -m "Add Official Links Batch 6"
          git push origin HEAD:main
