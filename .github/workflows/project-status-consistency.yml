name: Project Status Consistency

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PROJECT_STATUS.md"
      - "data/resources.json"
      - "data/categories.json"
      - "data/resource-icons.json"
      - "data/resource-links.json"
      - "data/resource-health-expectations.json"
      - "data/ai-config.json"
      - "data/click-config.json"
      - "scripts/project_status_consistency.py"
      - ".github/workflows/project-status-consistency.yml"
  pull_request:
    paths:
      - "PROJECT_STATUS.md"
      - "data/resources.json"
      - "data/categories.json"
      - "data/resource-icons.json"
      - "data/resource-links.json"
      - "data/resource-health-expectations.json"
      - "data/ai-config.json"
      - "data/click-config.json"
      - "scripts/project_status_consistency.py"
      - ".github/workflows/project-status-consistency.yml"

permissions:
  contents: read

concurrency:
  group: project-status-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check project status against canonical data
        run: python scripts/project_status_consistency.py
