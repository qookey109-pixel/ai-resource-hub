name: Ingest Agent-Native resource

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-agent-native-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Agent-Native to catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          resources_path = Path('data/resources.json')
          icons_path = Path('data/resource-icons.json')

          resources_doc = json.loads(resources_path.read_text())
          icons_doc = json.loads(icons_path.read_text())

          entry = {
            'id': 'builderio-agent-native',
            'name': 'Agent-Native',
            'type': 'github',
            'url': 'https://github.com/BuilderIO/agent-native',
            'categories': [
              'MCP / Agent Frameworks',
              'App / Full-stack Development',
              'AI Coding',
              'Developer Tools',
              'Automation / Workflow'
            ],
            'tags': [
              'agent-native', 'builderio', 'agentic-apps', 'agents', 'mcp', 'a2a',
              'cli', 'actions', 'tool-calling', 'memory', 'jobs', 'observability',
              'handoffs', 'full-stack', 'typescript', 'drizzle', 'nitro'
            ],
            'summary': 'Builder.io 開源的 Agentic App Framework，讓同一個 Action 同時提供給 UI、AI Agent、HTTP、MCP、A2A 與 CLI 使用，並整合工具、Skills、記憶、工作、可觀測性與 Handoff 等 Agent Runtime 能力。',
            'use_cases': [
              '建立同時具備傳統 UI 與 AI Agent 操作能力的應用程式',
              '用同一套 Action 串接 UI、HTTP、MCP、A2A 與 CLI',
              '快速建立含 Tools、Skills、Memory、Jobs 與 Handoff 的 Agent Runtime',
              '從官方範本快速建立 Chat、Content、Analytics、Design 等 Agent-Native App'
            ],
            'pricing': 'open-source',
            'open_source': True,
            'license': 'MIT',
            'difficulty': 'advanced',
            'status': 'active',
            'rating': 5,
            'added_at': '2026-08-28',
            'last_checked': '2026-08-28',
            'notes': 'README 明確標示 MIT；專案根 package.json 的 license 欄位目前顯示 ISC，兩處 metadata 有差異，因此若要重新散布特定 package，仍建議再核對該 package 的實際授權檔與 npm metadata。'
          }

          resources = resources_doc.setdefault('resources', [])
          if not any(r.get('id') == entry['id'] or r.get('url') == entry['url'] for r in resources):
              resources.append(entry)
          resources_doc['updated_at'] = '2026-08-28'

          icons_doc.setdefault('icons', {})['builderio-agent-native'] = {
            'url': 'https://github.com/BuilderIO.png?size=256',
            'source': 'github-organization-avatar-256-fallback-no-project-logo'
          }
          icons_doc['updated_at'] = '2026-08-28'

          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(',', ':')) + '\n')
          icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit catalog update
        run: |
          if git diff --quiet -- data/resources.json data/resource-icons.json; then
            echo 'No catalog change needed.'
            exit 0
          fi
          git config user.name 'qookey-resource-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json
          git commit -m 'Add BuilderIO Agent-Native resource'
          git push origin HEAD:main
