name: Temporary FreeLLMAPI status receipt

on:
  push:
    branches:
      - chore/freellmapi-resource-receipt-20260902

permissions:
  contents: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update project status from verified main evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "+ Monocolor Editorial Print**",
                  "+ Monocolor Editorial Print + FreeLLMAPI**",
              ),
              (
                  "- Catalog now contains **49 verified resources**.",
                  "- FreeLLMAPI added as an active MIT-licensed multi-provider LLM Gateway and a distinct project identity from the existing OmniRoute entry. PR #56 was merged as `86b9fdefad7f50d386c5cca47fff575e81680214`; the catalog records the official `client/public/favicon.svg` brand mark plus the official website, API reference, Clients & Coding Agents guide, Security & Key Handling guide, Provider ToS review and latest-release page. Upstream currently advertises about 34 free providers, 474 model families, 635 free endpoints and roughly 7.4B tokens/month, but those figures are provider-, account-, region-, quota- and policy-dependent rather than guaranteed capacity. The upstream README explicitly positions the free-provider pool for personal experimentation and learning rather than production, preserves each provider's own ToS and no-SLA boundary, and recommends a paid provider for production reliability. The router software remains MIT/open source; the optional live catalog is freemium, with the README currently listing US$19/year or US$49 lifetime while free installs receive a roughly 30-day-delayed monthly catalog snapshot. Stored provider keys are documented as AES-256-GCM encrypted, and production operators must preserve `ENCRYPTION_KEY` because losing it makes stored keys unrecoverable.\n- Catalog now contains **50 verified resources**.",
              ),
              (
                  "- Workflow run: `33585516370`\n- Commit: `efb56a60c8465af09befe982fb1adfa95ea49a78`\n- Result: PASS\n- Total: 49\n- Clean: 44\n- Expected variance: 5\n- Review required: 0\n- Broken resources: 0\n- Errors: 0\n- Raw reachable: 47\n- Raw restricted: 2\n- Raw redirected: 2\n- GitHub metadata checked: 32\n- Automatic catalog mutations: 0",
                  "- Workflow run: `33589079095`\n- Commit: `86b9fdefad7f50d386c5cca47fff575e81680214`\n- Result: PASS\n- Total: 50\n- Clean: 45\n- Expected variance: 5\n- Review required: 0\n- Broken resources: 0\n- Errors: 0\n- Raw reachable: 48\n- Raw restricted: 2\n- Raw redirected: 2\n- GitHub metadata checked: 33\n- Automatic catalog mutations: 0",
              ),
              (
                  "- Total resources: 49",
                  "- Total resources: 50",
              ),
              (
                  "- GitHub Pages is deployed through `.github/workflows/pages.yml`; the latest confirmed content deployment is Monocolor Editorial Print run `33585516484`, completed successfully on 2026-09-02.\n- Browser interaction regression CI is defined at `.github/workflows/frontend-interaction.yml`; the latest confirmed main content run is Monocolor Editorial Print run `33585516427`, completed successfully on 2026-09-02. Playwright remains test-only and is not shipped in the production frontend.\n- Full Resource Health V0.2 latest confirmed main run is `33585516370`, completed successfully with 49 total resources, 44 clean, 5 expected variances and 0 review-required items; raw evidence contains 47 reachable, 2 restricted, 2 redirected, 0 broken resources and 0 errors.",
                  "- GitHub Pages is deployed through `.github/workflows/pages.yml`; the latest confirmed content deployment is FreeLLMAPI run `33589079079`, completed successfully on 2026-09-02.\n- Browser interaction regression CI is defined at `.github/workflows/frontend-interaction.yml`; the latest confirmed main content run is FreeLLMAPI run `33589079161`, completed successfully on 2026-09-02. Playwright remains test-only and is not shipped in the production frontend.\n- Full Resource Health V0.2 latest confirmed main run is `33589079095`, completed successfully with 50 total resources, 45 clean, 5 expected variances and 0 review-required items; raw evidence contains 48 reachable, 2 restricted, 2 redirected, 0 broken resources and 0 errors.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit status receipt
        run: |
          git config user.name "qookey109-pixel"
          git config user.email "qookey109@gmail.com"
          git add PROJECT_STATUS.md
          if git diff --cached --quiet; then
            echo "No status changes required."
          else
            git commit -m "Record FreeLLMAPI resource deployment receipt"
            git push
          fi
