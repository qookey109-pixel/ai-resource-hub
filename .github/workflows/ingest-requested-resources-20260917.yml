name: Ingest Requested Resources 2026-09-17

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ingest-requested-resources-20260917.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Add verified resources, icons, links, and status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          TODAY = '2026-09-17'

          resources_path = Path('data/resources.json')
          icons_path = Path('data/resource-icons.json')
          links_path = Path('data/resource-links.json')
          status_path = Path('PROJECT_STATUS.md')

          resources_doc = json.loads(resources_path.read_text(encoding='utf-8'))
          resources = resources_doc.setdefault('resources', [])

          requested = [
              {
                  'id': 'jarrodwatts-jev-trader',
                  'name': 'Jev Trader',
                  'type': 'github',
                  'url': 'https://github.com/jarrodwatts/jev-trader',
                  'categories': ['Finance / Crypto', 'AI / LLM', 'Automation / Workflow', 'Developer Tools'],
                  'tags': ['jev-trader', 'monad', 'kuru', 'market-making', 'order-book', 'limit-orders', 'ai-trading', 'typesafe-ai', 'bun', 'typescript', 'dry-run'],
                  'summary': 'MIT 開源的 Monad／Kuru 低延遲 AI 交易範例。它會在每個約 300 ms 的 Monad block 讀取 MON-USDC order book，由模型判斷 buy 或 sell，並以 post-only limit order 掛單；預設可用 mock momentum heuristic 乾跑，也可改接 TypeSafe Jev 模型。',
                  'use_cases': [
                      '研究 Monad 高頻 block、Kuru order book 與 post-only market-making 的實作方式',
                      '在不提供 PRIVATE_KEY 的 dry-run 模式下觀察真實 order book、模型決策與模擬成交',
                      '研究如何把 AI 模型決策、鏈上送單、非同步 receipt 與 SSE dashboard 串成低延遲交易迴圈',
                      '作為 TypeScript／Bun 鏈上交易 bot、PnL 與 position tracking 的工程參考'
                  ],
                  'pricing': 'open-source',
                  'open_source': True,
                  'license': 'MIT',
                  'difficulty': 'advanced',
                  'status': 'active',
                  'rating': 4,
                  'added_at': TODAY,
                  'last_checked': TODAY,
                  'notes': 'README 明確支援無 PRIVATE_KEY 的 dry-run，並提供已部署的 mock-model dry-run dashboard。若設定 PRIVATE_KEY 進入 live 路徑，程式會送出真實鏈上掛單並產生 gas 成本；這是工程與研究範例，不代表策略已證明可獲利，實際交易可能發生價格、執行、智能合約與資金損失風險。API Key 與私鑰應只放在安全的環境變數或 Secret 管理中。'
              },
              {
                  'id': 'kruzovic7-ai-data-extractor',
                  'name': 'AI Coding Assistant Data Extractor',
                  'type': 'github',
                  'url': 'https://github.com/kruzovic7/ai-data-extractor',
                  'categories': ['Data / Analytics', 'AI Coding', 'Developer Tools', 'Automation / Workflow'],
                  'tags': ['ai-data-extractor', 'chat-history', 'jsonl', 'claude-code', 'codex', 'cursor', 'windsurf', 'trae', 'continue', 'gemini-cli', 'opencode', 'cline', 'roo-code', 'aider', 'backup', 'fine-tuning'],
                  'summary': 'MIT 開源的 AI Coding Assistant 本機對話資料匯出工具，可自動尋找 Claude Code、Codex CLI、Cursor、Windsurf、Trae、Continue、Gemini CLI、OpenCode、Cline／Roo Code 與 Aider 的本機紀錄，並統一轉成 JSONL，保留訊息、程式碼脈絡、Tool Calls、時間與 Session 等可取得欄位。',
                  'use_cases': [
                      '備份多個 AI Coding Assistant 的本機聊天與工作紀錄',
                      '把不同工具的對話正規化成統一 JSONL，供個人分析、搜尋或資料整理',
                      '在確認資料權利與隱私後，建立自己的 fine-tuning 或研究資料集',
                      '比較不同 Coding Agent 儲存格式，或擴充新的 extractor 支援來源'
                  ],
                  'pricing': 'open-source',
                  'open_source': True,
                  'license': 'MIT',
                  'difficulty': 'intermediate',
                  'status': 'active',
                  'rating': 5,
                  'added_at': TODAY,
                  'last_checked': TODAY,
                  'notes': '工具以 Python 3.9+ 標準函式庫為主，SQLite 會以唯讀模式開啟。Cursor、Windsurf、Trae 等部分工具沒有公開穩定儲存 Schema，因此 README 明確把其中部分解析描述為 best-effort heuristic。匯出的 code_context、tool_use、路徑與對話可能含 API Key、私人資訊或專有程式碼；公開、分享或訓練前應先掃描 Secret、確認資料權利並依各工具服務條款處理。'
              }
          ]

          existing_ids = {item.get('id') for item in resources}
          existing_urls = {str(item.get('url', '')).rstrip('/') for item in resources}
          added = []
          for resource in requested:
              if resource['id'] in existing_ids or resource['url'].rstrip('/') in existing_urls:
                  print(f"Resource already exists: {resource['id']}")
                  continue
              resources.append(resource)
              existing_ids.add(resource['id'])
              existing_urls.add(resource['url'].rstrip('/'))
              added.append(resource['id'])

          if added:
              resources_doc['updated_at'] = TODAY
              resources_path.write_text(
                  json.dumps(resources_doc, ensure_ascii=False, separators=(',', ':')) + '\n',
                  encoding='utf-8'
              )

          icons_doc = json.loads(icons_path.read_text(encoding='utf-8'))
          icons = icons_doc.setdefault('icons', {})
          icon_updates = {
              'jarrodwatts-jev-trader': {
                  'url': 'https://github.com/jarrodwatts.png?size=256',
                  'source': 'github-owner-avatar-256-fallback-no-project-logo'
              },
              'kruzovic7-ai-data-extractor': {
                  'url': 'https://github.com/kruzovic7.png?size=256',
                  'source': 'github-owner-avatar-256-fallback-no-project-logo'
              }
          }
          icons_changed = False
          for resource_id, icon in icon_updates.items():
              if resource_id not in icons:
                  icons[resource_id] = icon
                  icons_changed = True
          if icons_changed:
              icons_doc['updated_at'] = TODAY
              icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          links_doc = json.loads(links_path.read_text(encoding='utf-8'))
          links = links_doc.setdefault('links', {})
          link_updates = {
              'jarrodwatts-jev-trader': [
                  {
                      'label': 'Jev Trader 線上 Dry-run Demo',
                      'kind': 'demo',
                      'url': 'https://jev-trader-production.up.railway.app',
                      'description': 'README 列出的已部署 dry-run／mock-model 版本，可查看目前模型、wallet、block event 與交易歷史。'
                  },
                  {
                      'label': 'Jev Trader README',
                      'kind': 'documentation',
                      'url': 'https://github.com/jarrodwatts/jev-trader/blob/main/README.md',
                      'description': '官方執行方式、dry-run／live 行為、API endpoints、事件格式與 300 ms latency budget 說明。'
                  },
                  {
                      'label': 'Jev Trader SPEC',
                      'kind': 'documentation',
                      'url': 'https://github.com/jarrodwatts/jev-trader/blob/main/SPEC.md',
                      'description': 'Repository 內的正式規格文件，適合進一步理解系統目標與交易迴圈設計。'
                  },
                  {
                      'label': 'Jev Trader License',
                      'kind': 'documentation',
                      'url': 'https://github.com/jarrodwatts/jev-trader/blob/main/LICENSE',
                      'description': '官方 MIT License。'
                  }
              ],
              'kruzovic7-ai-data-extractor': [
                  {
                      'label': 'AI Data Extractor README',
                      'kind': 'documentation',
                      'url': 'https://github.com/kruzovic7/ai-data-extractor/blob/main/README.md',
                      'description': '官方支援來源、CLI 用法、JSONL 輸出格式、擴充 extractor 方法與隱私安全注意事項。'
                  },
                  {
                      'label': 'AI Data Extractor License',
                      'kind': 'documentation',
                      'url': 'https://github.com/kruzovic7/ai-data-extractor/blob/main/LICENSE',
                      'description': '官方 MIT License。'
                  }
              ]
          }
          links_changed = False
          for resource_id, entries in link_updates.items():
              if resource_id not in links:
                  links[resource_id] = entries
                  links_changed = True
          if links_changed:
              links_doc['updated_at'] = TODAY
              links_path.write_text(json.dumps(links_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status_text = status_path.read_text(encoding='utf-8')
          catalog_count = len(resources)
          status_text = re.sub(
              r'- Current canonical catalog size: \*\*\d+ resources\*\*',
              f'- Current canonical catalog size: **{catalog_count} resources**',
              status_text,
              count=1,
          )
          status_text = re.sub(
              r'- \d+ canonical resources are currently present in `data/resources\.json`\.',
              f'- {catalog_count} canonical resources are currently present in `data/resources.json`.',
              status_text,
              count=1,
          )

          baseline_lines = []
          if 'Jev Trader (`jarrodwatts/jev-trader`)' not in status_text:
              baseline_lines.append('- Jev Trader (`jarrodwatts/jev-trader`) — MIT-licensed Monad/Kuru low-latency AI trading example with dry-run mode, optional TypeSafe Jev inference, post-only limit-order quoting, SSE telemetry and explicit live-key/on-chain risk boundaries.')
          if 'AI Coding Assistant Data Extractor (`kruzovic7/ai-data-extractor`)' not in status_text:
              baseline_lines.append('- AI Coding Assistant Data Extractor (`kruzovic7/ai-data-extractor`) — MIT-licensed local chat-history exporter that normalizes ten AI coding assistants into JSONL for backup, personal analytics or rights-cleared training workflows; exported data requires secret/privacy review before sharing.')
          if baseline_lines:
              marker = '- GPUtw Skill (`GPUtw-ai/GPUtw-Skill`) — official MIT-licensed GPUtw.ai Agent Skill with Claude Code / Codex / Cursor / Copilot / Gemini CLI support and an official beta MCP server; API keys require least-privilege handling, cloud usage can incur GPUtw charges, and root exec remains opt-in.\n'
              insertion = marker + '\n'.join(baseline_lines) + '\n'
              if marker in status_text:
                  status_text = status_text.replace(marker, insertion, 1)
              else:
                  heading = '## Recent verified ingestion / refresh baseline\n\n'
                  status_text = status_text.replace(heading, heading + '\n'.join(baseline_lines) + '\n', 1)

          status_path.write_text(status_text, encoding='utf-8')

          print(f"added={added}")
          print(f"catalog_count={catalog_count}")
          PY

      - name: Validate catalog and status
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/resources.json >/dev/null
          python -m json.tool data/resource-icons.json >/dev/null
          python -m json.tool data/resource-links.json >/dev/null
          python scripts/project_status_consistency.py

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/resources.json data/resource-icons.json data/resource-links.json PROJECT_STATUS.md; then
            echo "Requested resources are already present and synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/resource-icons.json data/resource-links.json PROJECT_STATUS.md
          git commit -m "Add Jev Trader and AI Data Extractor"
          git push origin HEAD:main
