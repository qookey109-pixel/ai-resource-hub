name: Temporary AI Fallback Validation

on:
  push:
    branches:
      - fix/ai-no-match-fallback-20260903
    paths:
      - ".github/workflows/_tmp-ai-fallback-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Check Worker syntax
        run: node --check worker/src/index.js

      - name: Exercise deterministic fallback against current catalog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';

          let source = fs.readFileSync('worker/src/index.js', 'utf8');
          source = source.replace(
            'export default {',
            'globalThis.__test = { fallbackIntent, fallbackRecommendations }; globalThis.__worker = {'
          );
          const context = { console };
          vm.createContext(context);
          vm.runInContext(source, context);

          const catalog = JSON.parse(fs.readFileSync('data/resources.json', 'utf8')).resources;
          const { fallbackIntent, fallbackRecommendations } = context.__test;

          const query = '我要從文字快速生成可以拿去做遊戲原型的 3D 模型';
          const recovered = fallbackRecommendations(fallbackIntent(query), catalog);
          assert.ok(
            recovered.some((item) => item.id === 'meshy-ai'),
            `expected meshy-ai, got ${JSON.stringify(recovered)}`
          );

          const generic = fallbackRecommendations(fallbackIntent('AI'), catalog);
          assert.equal(generic.length, 0, `generic AI query should not trigger fallback: ${JSON.stringify(generic)}`);

          const missing = fallbackRecommendations(
            fallbackIntent('我要找完全不存在的量子香蕉編譯器'),
            catalog
          );
          assert.equal(missing.length, 0, `unrelated query should remain no-match: ${JSON.stringify(missing)}`);

          console.log('Deterministic fallback validation PASS', recovered.map((item) => item.id));
          NODE
