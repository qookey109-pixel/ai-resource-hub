name: Two Row Category Chips

on:
  push:
    paths:
      - '.github/workflows/two-row-category-chips.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Make category chips wrap into two rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('css/styles.css')
          text = path.read_text(encoding='utf-8')

          old = '''.quick-categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 0 2px;
  scrollbar-width: none;
  white-space: nowrap;
}
.quick-categories::-webkit-scrollbar { display: none; }
'''
          new = '''.quick-categories {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  overflow: visible;
  padding: 0 0 2px;
  white-space: normal;
}
.quick-categories::-webkit-scrollbar { display: none; }
'''

          if old not in text:
              raise SystemExit('Expected quick-categories CSS block not found')
          text = text.replace(old, new, 1)

          mobile_marker = '@media (max-width: 720px) {'
          mobile_patch = '''@media (max-width: 720px) {
  .quick-categories {
    gap: 7px;
    max-height: 76px;
    overflow: hidden;
  }
  .quick-category {
    min-height: 32px;
    padding: 0 11px;
    font-size: 11px;
  }
'''
          if mobile_marker not in text:
              raise SystemExit('Mobile media query not found')
          text = text.replace(mobile_marker, mobile_patch, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit layout update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- css/styles.css; then
            echo "No layout change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css
          git commit -m "Wrap category chips into two rows"
          git push origin HEAD:main
