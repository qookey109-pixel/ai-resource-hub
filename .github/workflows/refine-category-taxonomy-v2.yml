name: Refine Category Taxonomy V2

on:
  push:
    paths:
      - '.github/workflows/refine-category-taxonomy-v2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Refine categories and navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          today = '2026-08-27'

          categories = [
              {'id':'ai-llm','name':'AI / LLM','display_name':'AI 模型 / LLM','icon':'🤖'},
              {'id':'ai-coding','name':'AI Coding','display_name':'AI 程式開發','icon':'💻'},
              {'id':'agent-skills','name':'Agent Skills','display_name':'Agent Skills','icon':'🧩'},
              {'id':'mcp-agent-frameworks','name':'MCP / Agent Frameworks','display_name':'MCP / Agent 框架','icon':'🔗'},
              {'id':'legal-compliance','name':'Legal / Compliance','display_name':'法律 / 法遵','icon':'⚖️'},
              {'id':'search-research','name':'Search / Research','display_name':'搜尋 / 研究','icon':'🔎'},
              {'id':'osint-intelligence','name':'OSINT / Intelligence','display_name':'OSINT / 情報','icon':'🌐'},
              {'id':'automation-workflow','name':'Automation / Workflow','display_name':'自動化 / 工作流','icon':'⚙️'},
              {'id':'scraping-data-collection','name':'Scraping / Data Collection','display_name':'網頁擷取 / 資料蒐集','icon':'🕷️'},
              {'id':'data-analytics','name':'Data / Analytics','display_name':'資料分析 / 視覺化','icon':'📊'},
              {'id':'cloud-deployment','name':'Cloud / Deployment','display_name':'雲端 / 部署','icon':'☁️'},
              {'id':'database-backend','name':'Database / Backend','display_name':'資料庫 / Backend','icon':'🗄️'},
              {'id':'app-fullstack','name':'App / Full-stack Development','display_name':'App / 全端開發','icon':'📱'},
              {'id':'developer-tools','name':'Developer Tools','display_name':'開發者工具','icon':'🛠️'},
              {'id':'testing-qa','name':'Testing / QA','display_name':'測試 / QA','icon':'🧪'},
              {'id':'security-reverse','name':'Security / Reverse Engineering','display_name':'資安 / 逆向工程','icon':'🔐'},
              {'id':'ui-ux-design','name':'UI / UX Design','display_name':'UI / UX 設計','icon':'🎨'},
              {'id':'frontend-components-animation','name':'Frontend Components / Animation','display_name':'前端元件 / 動畫','icon':'✨'},
              {'id':'three-d-webgl','name':'3D / WebGL','display_name':'3D / WebGL','icon':'🧊'},
              {'id':'three-d-generation-avatar','name':'3D Generation / Avatar','display_name':'3D 生成 / Avatar','icon':'🧍'},
              {'id':'image-generation-design-ai','name':'Image Generation / Design AI','display_name':'圖片生成 / 設計 AI','icon':'🖼️'},
              {'id':'video-generation-editing','name':'Video Generation / Editing','display_name':'影片生成 / 剪輯','icon':'🎬'},
              {'id':'voice-speech-ai','name':'Voice / TTS / Speech AI','display_name':'語音 / TTS / Speech','icon':'🎙️'},
              {'id':'audio-music-production','name':'Audio / Music Production','display_name':'音訊 / 音樂製作','icon':'🎵'},
              {'id':'game-development','name':'Game Development','display_name':'遊戲開發','icon':'🎮'},
              {'id':'game-assets-pixel-art','name':'Game Assets / Pixel Art','display_name':'遊戲素材 / Pixel Art','icon':'👾'},
              {'id':'finance-crypto','name':'Finance / Crypto','display_name':'金融 / 加密貨幣','icon':'💰'},
              {'id':'github-libraries','name':'GitHub Libraries','display_name':'GitHub 函式庫','icon':'📦'},
              {'id':'learning-documentation','name':'Learning / Documentation','display_name':'學習 / 文件','icon':'📚'},
              {'id':'other','name':'Other','display_name':'其他','icon':'🧰'},
          ]

          categories_path = Path('data/categories.json')
          categories_doc = {
              'schema_version': '0.2',
              'updated_at': today,
              'categories': categories,
          }
          categories_path.write_text(json.dumps(categories_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          mapped = {
              'emil-kowalski-skills': ['Agent Skills','AI Coding','UI / UX Design'],
              'refero-styles': ['UI / UX Design','AI Coding','Learning / Documentation'],
              'soundshockaudio': ['Audio / Music Production','Game Development'],
              'hallmark': ['Agent Skills','UI / UX Design','AI Coding'],
              'ip-as-logo-skill': ['Agent Skills','Image Generation / Design AI','UI / UX Design'],
              'react-bits-shape-grid': ['Frontend Components / Animation','UI / UX Design','App / Full-stack Development'],
              'ui-skills': ['Agent Skills','UI / UX Design','Testing / QA','AI Coding'],
              'cloudflare-dashboard': ['Cloud / Deployment','Database / Backend','Developer Tools'],
              'xorxor-hu-codepen': ['Frontend Components / Animation','UI / UX Design','Learning / Documentation'],
              'oracle-cloud-free-tier': ['Cloud / Deployment','Database / Backend','Developer Tools'],
              'supabase-dashboard': ['Database / Backend','App / Full-stack Development','Cloud / Deployment'],
              'mistral-studio': ['AI / LLM','Developer Tools'],
              'capafy-ai': ['Agent Skills','AI / LLM','Developer Tools'],
              'anime-js': ['Frontend Components / Animation','GitHub Libraries','Developer Tools'],
              'world-monitor': ['OSINT / Intelligence','Search / Research','Data / Analytics'],
              'pi-agent-harness': ['MCP / Agent Frameworks','AI Coding','Developer Tools','GitHub Libraries'],
              'money-printer-turbo': ['Video Generation / Editing','Automation / Workflow','AI / LLM'],
              'reverse-skill': ['Security / Reverse Engineering','Agent Skills','Learning / Documentation'],
              'mechanical-deployables-threejs': ['3D / WebGL','Game Development','Learning / Documentation'],
              'voice-studio': ['Voice / TTS / Speech AI','Audio / Music Production','MCP / Agent Frameworks','Developer Tools'],
              'dsh-desktop': ['MCP / Agent Frameworks','AI Coding','App / Full-stack Development','Developer Tools'],
              'ai-website-cloner-template': ['AI Coding','Agent Skills','Scraping / Data Collection','UI / UX Design'],
              'threeui-community': ['3D / WebGL','Frontend Components / Animation','GitHub Libraries','UI / UX Design'],
              'elevenlabs': ['Voice / TTS / Speech AI','Audio / Music Production','AI / LLM','Developer Tools'],
              'meshy-ai': ['3D Generation / Avatar','Game Development','3D / WebGL','Developer Tools'],
              'mattpocock-skills': ['Agent Skills','AI Coding','Testing / QA','Learning / Documentation'],
              'oneworks-avatar': ['3D Generation / Avatar','3D / WebGL','Agent Skills','App / Full-stack Development'],
              'legal-skills-open': ['Legal / Compliance','Agent Skills','Search / Research','Learning / Documentation'],
              'pixelartbase-free-com-tw': ['Game Assets / Pixel Art','Game Development','Learning / Documentation'],
          }

          fallback = {
              'AI / LLM':'AI / LLM',
              'AI Coding':'AI Coding',
              'Agents / MCP / Skills':'Agent Skills',
              'Game AI / Game Dev':'Game Development',
              '3D / WebGL / Graphics':'3D / WebGL',
              'UI / UX / Design':'UI / UX Design',
              'Image / Video / Audio AI':'Image Generation / Design AI',
              'Audio / Music Production':'Audio / Music Production',
              'Search / Research':'Search / Research',
              'Automation':'Automation / Workflow',
              'Scraping / Data Collection':'Scraping / Data Collection',
              'Data / Analytics':'Data / Analytics',
              'Database':'Database / Backend',
              'Cloud / Deployment':'Cloud / Deployment',
              'Security':'Security / Reverse Engineering',
              'GitHub Libraries':'GitHub Libraries',
              'Developer Tools':'Developer Tools',
              'Finance / Crypto':'Finance / Crypto',
              'App Development':'App / Full-stack Development',
              'Testing / QA':'Testing / QA',
              'Learning / Documentation':'Learning / Documentation',
              'Other':'Other',
          }

          resources_path = Path('data/resources.json')
          resources_doc = json.loads(resources_path.read_text(encoding='utf-8'))
          for resource in resources_doc.get('resources', []):
              rid = resource.get('id')
              if rid in mapped:
                  resource['categories'] = mapped[rid]
              else:
                  converted = []
                  for old in resource.get('categories', []):
                      new = fallback.get(old, old)
                      if new not in converted:
                          converted.append(new)
                  resource['categories'] = converted or ['Other']
          resources_doc['updated_at'] = today
          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          app_path = Path('js/app.js')
          app = app_path.read_text(encoding='utf-8')
          old_block = """function renderQuickCategories() {
            els.quickCategories.replaceChildren();
            els.quickCategories.append(createQuickCategory('趨勢', ''));

            const counts = new Map();
            for (const resource of state.resources) {
              for (const category of resource.categories ?? []) {
                counts.set(category, (counts.get(category) ?? 0) + 1);
              }
            }

            const ranked = [...counts.entries()]
              .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
              .slice(0, 16);

            for (const [category] of ranked) {
              const info = categoryInfo(category);
              const displayName = info?.display_name ?? category;
              const label = `${info?.icon ? `${info.icon} ` : ''}${displayName}`;
              els.quickCategories.append(createQuickCategory(label, category));
            }
          }"""
          new_block = """function renderQuickCategories() {
            els.quickCategories.replaceChildren();
            els.quickCategories.append(createQuickCategory('全部資源', ''));

            const usedCategories = new Set(
              state.resources.flatMap((resource) => resource.categories ?? [])
            );

            for (const info of state.categories) {
              if (!usedCategories.has(info.name)) continue;
              const displayName = info.display_name ?? info.name;
              const label = `${info.icon ? `${info.icon} ` : ''}${displayName}`;
              els.quickCategories.append(createQuickCategory(label, info.name));
            }
          }"""
          if old_block not in app:
              raise SystemExit('Expected renderQuickCategories block not found; refusing unsafe replacement.')
          app = app.replace(old_block, new_block)
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('css/styles.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.quick-category:first-child::before { content: "🔥 "; }\n', '')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate taxonomy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cats = json.loads(Path('data/categories.json').read_text(encoding='utf-8'))['categories']
          resources = json.loads(Path('data/resources.json').read_text(encoding='utf-8'))['resources']
          valid = {c['name'] for c in cats}
          unknown = sorted({cat for r in resources for cat in r.get('categories', []) if cat not in valid})
          if unknown:
              raise SystemExit(f'Unknown categories: {unknown}')
          if '趨勢' in Path('js/app.js').read_text(encoding='utf-8'):
              raise SystemExit('Trend label still present in app.js')
          print(f'Validated {len(resources)} resources against {len(cats)} refined categories.')
          PY

      - name: Commit taxonomy update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/categories.json data/resources.json js/app.js css/styles.css
          if git diff --cached --quiet; then
            echo "No taxonomy changes required."
            exit 0
          fi
          git commit -m "Refine resource categories and remove trends"
          git push origin HEAD:main
