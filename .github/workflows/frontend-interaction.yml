name: Frontend Interaction Regression

on:
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/resources.json"
      - "data/categories.json"
      - "data/resource-icons.json"
      - "data/resource-links.json"
      - "data/click-config.json"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/frontend-interaction.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "data/resources.json"
      - "data/categories.json"
      - "data/resource-icons.json"
      - "data/resource-links.json"
      - "data/click-config.json"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/frontend-interaction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install test dependency
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run resource detail regressions
        run: npm run test:browser
