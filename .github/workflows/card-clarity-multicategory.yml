name: Card Clarity and Multi Category

on:
  push:
    paths:
      - '.github/workflows/card-clarity-multicategory.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply multi-category display and cache bust
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = "for (const category of (resource.categories ?? []).slice(0, 2)) {"
          new = "for (const category of (resource.categories ?? []).slice(0, 5)) {"
          if old not in text:
              raise SystemExit('Expected two-category rendering limit not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          css_anchor = '  <link rel="stylesheet" href="./css/category-layout.css?v=20260827-1" />\n'
          css_link = '  <link rel="stylesheet" href="./css/card-clarity-v2.css?v=20260827-1" />\n'
          if css_link not in html:
              if css_anchor not in html:
                  raise SystemExit('Category layout CSS anchor not found')
              html = html.replace(css_anchor, css_anchor + css_link, 1)

          old_script = '  <script type="module" src="./js/app.js"></script>'
          new_script = '  <script type="module" src="./js/app.js?v=20260827-2"></script>'
          if old_script in html:
              html = html.replace(old_script, new_script, 1)
          elif new_script not in html:
              raise SystemExit('app.js script tag not found')
          index.write_text(html, encoding='utf-8')
          PY

      - name: Verify trends are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --exclude-dir=.git --exclude='card-clarity-multicategory.yml' -n '趨勢' .; then
            echo 'Unexpected 趨勢 label remains in repository.'
            exit 1
          fi

      - name: Commit UI update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html
          if git diff --cached --quiet; then
            echo 'No UI changes needed.'
            exit 0
          fi
          git commit -m "Show more categories and bust stale navigation cache"
          git push origin HEAD:main
