name: One-off Refresh Matt Pocock Skills 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-off-add-matt-pocock-skills-20260903.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh existing Matt Pocock Skills entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          today = "2026-09-03"
          rid = "mattpocock-skills"
          url = "https://github.com/mattpocock/skills"

          resources_path = Path("data/resources.json")
          icons_path = Path("data/resource-icons.json")
          links_path = Path("data/resource-links.json")

          resources_doc = json.loads(resources_path.read_text(encoding="utf-8"))
          icons_doc = json.loads(icons_path.read_text(encoding="utf-8"))
          links_doc = json.loads(links_path.read_text(encoding="utf-8"))

          matches = [r for r in resources_doc.get("resources", []) if r.get("id") == rid]
          assert len(matches) == 1, f"expected exactly one {rid}, found {len(matches)}"
          item = matches[0]
          assert str(item.get("url", "")).rstrip("/").lower() == url.lower()

          original_added_at = item.get("added_at") or "2026-08-26"
          item.update({
            "name": "Skills For Real Engineers",
            "type": "github",
            "url": url,
            "categories": ["Agent Skills", "AI Coding", "Architecture / System Design", "Testing / QA", "Automation / Workflow", "Learning / Documentation"],
            "tags": ["agent-skills", "software-engineering", "tdd", "debugging", "code-review", "architecture", "domain-modeling", "specs", "tickets", "handoff", "codex", "claude-code", "productivity", "skills.sh"],
            "summary": "Matt Pocock 日常使用的工程導向 Agent Skills，將需求釐清、Domain Modeling、Spec、Ticket 拆解、TDD、除錯、Code Review、架構改善、Merge Conflict、Research 與 Handoff 等成熟工程紀律拆成小型、可調整、可組合的能力，供 Codex、Claude Code 等 Coding Agent 使用。",
            "use_cases": [
              "用 grill-with-docs、to-spec、to-tickets 與 wayfinder 把模糊需求整理成可執行規格與大型工作圖",
              "用 tdd、diagnosing-bugs、code-review 與 resolving-merge-conflicts 建立有 feedback loop 的實作與品質流程",
              "用 domain-modeling、codebase-design、improve-codebase-architecture 維持一致術語、模組邊界與可演進架構",
              "用 handoff、research、teach、wait-what 等 Productivity Skills 延續長任務、研究、教學與跨 Agent 工作",
              "透過 Claude Code 官方 Marketplace Plugin 或 skills.sh / npx 選擇性安裝到 Codex 與其他 Agent"
            ],
            "pricing": "open-source",
            "open_source": True,
            "license": "MIT",
            "difficulty": "intermediate",
            "status": "active",
            "rating": 5,
            "added_at": original_added_at,
            "last_checked": today,
            "notes": "2026-09-03 重新檢查：Repository 公開、MIT、未封存，約 246k Stars。作者定位為『Skills for Real Engineers』，重點是小型、可調整、可組合的工程能力，而不是由單一流程框架接管整個專案。README 明確支援 Claude Code 官方 Marketplace Plugin，Codex 與其他 Agent 可用 npx skills@latest add mattpocock/skills 選擇性安裝。Engineering Skills 區分 User-invoked 與 Model-invoked；setup-matt-pocock-skills 是 prompt-driven setup，會先讀 Git remote、AGENTS.md / CLAUDE.md、CONTEXT.md、ADR 與 Issue Tracker 狀態，再向使用者確認後寫入。部分 Skills 可操作專案文件、Issues、Git 或 Agent 設定，因此仍應維持現有 repository authority、權限與 review gate。"
          })

          icons_doc.setdefault("icons", {})[rid] = {
            "url": "https://www.google.com/s2/favicons?sz=128&domain_url=https://aihero.dev",
            "source": "official-aihero-domain-favicon-128"
          }

          links_doc.setdefault("links", {})[rid] = [
            {
              "label": "AI Hero Skills 官方頁",
              "kind": "website",
              "url": "https://aihero.dev/skills",
              "description": "Matt Pocock 官方 Skills 入口與完整介紹。"
            },
            {
              "label": "skills.sh 安裝與索引頁",
              "kind": "website",
              "url": "https://skills.sh/mattpocock/skills",
              "description": "README 指定的 Skills 索引與安裝入口，可挑選需要的 Skill 安裝到 Codex 與其他 Agent。"
            },
            {
              "label": "Engineering Skills 索引",
              "kind": "documentation",
              "url": "https://github.com/mattpocock/skills/blob/main/skills/engineering/README.md",
              "description": "官方工程 Skills 清單，區分 User-invoked 與 Model-invoked 能力。"
            }
          ]

          resources_doc["updated_at"] = today
          icons_doc["updated_at"] = today
          links_doc["updated_at"] = today

          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          links_path.write_text(json.dumps(links_doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          check = [r for r in resources_doc["resources"] if r.get("id") == rid]
          assert len(check) == 1
          assert check[0]["added_at"] == original_added_at
          assert check[0]["last_checked"] == today
          assert icons_doc["icons"][rid]["source"] == "official-aihero-domain-favicon-128"
          assert len(links_doc["links"][rid]) == 3
          print("Refreshed without duplication:", rid, "added_at=", original_added_at)
          PY

      - name: Validate catalog and secondary links
        run: |
          python scripts/resource_health.py --validate-only
          python scripts/resource_links_validate.py
          python scripts/resource_health_triage.py --validate-only

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run frontend interaction regression
        run: npm run test:browser

      - name: Commit catalog refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/resource-icons.json data/resource-links.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Matt Pocock engineering skills resource"
          git push origin HEAD:main
