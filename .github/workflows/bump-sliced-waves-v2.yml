name: Bump Sliced Waves V2 Cache

on:
  push:
    paths:
      - '.github/workflows/bump-sliced-waves-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Bump sliced waves assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./css/sliced-waves-background.css?v=20260828-1', './css/sliced-waves-background.css?v=20260828-2')
          s = s.replace('./js/sliced-waves-background.js?v=20260828-1', './js/sliced-waves-background.js?v=20260828-2')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify mount
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="sliced-waves-background"' index.html
          grep -q 'sliced-waves-background.css?v=20260828-2' index.html
          grep -q 'sliced-waves-background.js?v=20260828-2' index.html

      - name: Commit cache refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No cache refresh needed.'
            exit 0
          fi
          git commit -m 'Refresh sliced waves background assets'
          git push origin HEAD:main
