name: One-off ingest GPUtw Skill 2026-09-17

on:
  push:
    branches:
      - ingest/gputw-skill-20260917
    paths:
      - .github/workflows/one-off-ingest-gputw-skill-20260917.yml

permissions:
  contents: write

jobs:
  ingest-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add GPUtw Skill catalog entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          today = "2026-09-17"
          resource_id = "gputw-ai-gputw-skill"
          canonical_url = "https://github.com/GPUtw-ai/GPUtw-Skill"

          resources_path = Path("data/resources.json")
          resources = json.loads(resources_path.read_text(encoding="utf-8"))
          items = resources["resources"]

          if any(item.get("id") == resource_id for item in items):
              raise SystemExit(f"duplicate resource id: {resource_id}")
          if any(str(item.get("url", "")).rstrip("/").lower() == canonical_url.rstrip("/").lower() for item in items):
              raise SystemExit(f"duplicate canonical url: {canonical_url}")

          items.append({
              "id": resource_id,
              "name": "GPUtw Skill",
              "type": "github",
              "url": canonical_url,
              "categories": [
                  "Agent Skills",
                  "Cloud / Deployment",
                  "MCP / Agent Frameworks",
                  "AI Coding",
                  "Developer Tools"
              ],
              "tags": [
                  "gputw",
                  "gpu-cloud",
                  "taiwan",
                  "agent-skill",
                  "mcp",
                  "claude-code",
                  "codex",
                  "cursor",
                  "gemini-cli",
                  "gpu-deployment",
                  "vault",
                  "api"
              ],
              "summary": "GPUtw.ai 官方 Agent Skill 與 MCP 工具包，讓 Claude Code、Codex、Cursor、GitHub Copilot、Gemini CLI 等 AI Coding Agent 理解並操作 GPUtw GPU 雲端 REST API，可用自然語言部署與監控 GPU 執行個體、管理網路與 Vault、搬移模型及排查 API 錯誤。",
              "use_cases": [
                  "讓 Claude Code、Codex、Cursor、Copilot 或 Gemini CLI 依官方 API 規則操作 GPUtw 雲端",
                  "用自然語言查 GPU 容量、建立／停止／重啟執行個體並監控狀態、資源、事件與日誌",
                  "管理 GPUtw Vault 的檔案上傳、分段續傳，以及從 URL／Hugging Face 伺服器端下載模型",
                  "透過官方 MCP Server 使用型別化 GPU／Instance／Vault 工具，減少自行組裝 curl 與 API 請求的成本"
              ],
              "pricing": "open-source",
              "open_source": True,
              "license": "MIT",
              "difficulty": "intermediate",
              "status": "active",
              "rating": 5,
              "added_at": today,
              "last_checked": today,
              "notes": "2026-09-17 檢查：這是 GPUtw.ai 官方第一方 Skill，Repository 公開、MIT、未封存，default branch 為 master；目前 README／plugin metadata 標示 v1.1.0-beta.1。Skill 本身已定位為穩定內容，但官方 MCP Server 仍標示 beta，提供 18 個結構化工具。API Key 應使用最小必要 scope 並透過環境變數或安全儲存；外掛把 api_key 標記為 sensitive。stop／delete 等操作具有狀態變更或破壞性，exec-in-instance 會以 root 在容器內執行指令，且預設不註冊，只有明確設定 GPUTW_MCP_ALLOW_EXEC=1 才會開啟。Repository／Skill 免費開源，但實際使用 GPUtw GPU 雲端、連接埠或其他計費資源仍依 GPUtw 當下方案與用量計費。專案於 2026-09-15 才建立，仍屬非常新的官方整合，正式自動化前應固定版本並保留人工 approval gate。"
          })
          resources["updated_at"] = today
          resources_path.write_text(
              json.dumps(resources, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          icons_path = Path("data/resource-icons.json")
          icons = json.loads(icons_path.read_text(encoding="utf-8"))
          if resource_id in icons["icons"]:
              raise SystemExit(f"duplicate icon id: {resource_id}")
          icons["icons"][resource_id] = {
              "url": "https://www.google.com/s2/favicons?sz=128&domain_url=https://gputw.ai",
              "source": "official-gputw-domain-favicon-128"
          }
          icons["updated_at"] = today
          icons_path.write_text(json.dumps(icons, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          links_path = Path("data/resource-links.json")
          links = json.loads(links_path.read_text(encoding="utf-8"))
          if resource_id in links["links"]:
              raise SystemExit(f"duplicate supplemental link id: {resource_id}")
          links["links"][resource_id] = [
              {
                  "label": "GPUtw 官方網站",
                  "kind": "website",
                  "url": "https://gputw.ai/",
                  "description": "GPUtw 官方 GPU 雲端服務入口。"
              },
              {
                  "label": "GPUtw 官方文件",
                  "kind": "documentation",
                  "url": "https://gputw.ai/docs",
                  "description": "GPUtw REST API、GPU 執行個體、Vault、網路、帳務與整合說明的官方文件。"
              },
              {
                  "label": "GPUtw SKILL.md",
                  "kind": "documentation",
                  "url": "https://github.com/GPUtw-ai/GPUtw-Skill/blob/master/SKILL.md",
                  "description": "官方 Agent Skill 定義與決策樹，供 Claude Code、Codex、Cursor 等 Agent 查閱。"
              },
              {
                  "label": "GPUtw MCP 使用指南",
                  "kind": "documentation",
                  "url": "https://github.com/GPUtw-ai/GPUtw-Skill/blob/master/guides/12-mcp.md",
                  "description": "官方 MCP Server 安裝、環境變數、工具邊界、安全設定與連線驗證指南。"
              }
          ]
          links["updated_at"] = today
          links_path.write_text(json.dumps(links, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate resource catalog
        run: python scripts/resource_health.py --validate-only

      - name: Validate resource links
        run: python scripts/resource_links_validate.py

      - name: Validate health triage
        run: python scripts/resource_health_triage.py --validate-only

      - name: Install browser-test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Commit catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resources.json data/resource-icons.json data/resource-links.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
            exit 1
          fi
          git commit -m "Add GPUtw Skill to resource catalog"
          git push origin HEAD:${GITHUB_REF_NAME}
