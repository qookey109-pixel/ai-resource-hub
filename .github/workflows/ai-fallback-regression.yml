name: AI Fallback Regression

on:
  pull_request:
    paths:
      - "worker/src/index.js"
      - "worker/src/router.js"
      - "scripts/ai_fallback_regression.mjs"
      - "scripts/router_regression.mjs"
      - "data/resources.json"
      - ".github/workflows/ai-fallback-regression.yml"
  push:
    branches:
      - main
    paths:
      - "worker/src/index.js"
      - "worker/src/router.js"
      - "scripts/ai_fallback_regression.mjs"
      - "scripts/router_regression.mjs"
      - "data/resources.json"
      - ".github/workflows/ai-fallback-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run deterministic fallback regression
        run: node scripts/ai_fallback_regression.mjs

      - name: Run typed System-1 router regression
        run: node scripts/router_regression.mjs
