name: Deploy AI Resource Hub to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".nojekyll"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "data/resources.json"
      - "data/categories.json"
      - "data/resource-icons.json"
      - "data/resource-links.json"
      - "data/click-config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/css _site/js _site/data
          cp index.html .nojekyll _site/
          cp -R assets/. _site/assets/
          cp -R css/. _site/css/
          cp -R js/. _site/js/
          cp \
            data/resources.json \
            data/categories.json \
            data/resource-icons.json \
            data/resource-links.json \
            data/click-config.json \
            _site/data/
          find _site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
