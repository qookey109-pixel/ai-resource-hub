name: Ingest Archify resource

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-archify-20260830.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Archify to catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          resources_path = Path('data/resources.json')
          icons_path = Path('data/resource-icons.json')
          categories_path = Path('data/categories.json')

          resources_doc = json.loads(resources_path.read_text())
          icons_doc = json.loads(icons_path.read_text())
          categories_doc = json.loads(categories_path.read_text())

          category = {
            'id': 'architecture-system-design',
            'name': 'Architecture / System Design',
            'display_name': '架構 / 系統設計',
            'icon': '🏗️'
          }
          categories = categories_doc.setdefault('categories', [])
          if not any(c.get('id') == category['id'] or c.get('name') == category['name'] for c in categories):
              insert_at = next((i + 1 for i, c in enumerate(categories) if c.get('name') == 'AI Coding'), len(categories))
              categories.insert(insert_at, category)
          categories_doc['updated_at'] = '2026-08-30'

          entry = {
            'id': 'tt-a1i-archify',
            'name': 'Archify',
            'type': 'github',
            'url': 'https://github.com/tt-a1i/archify',
            'categories': [
              'Architecture / System Design',
              'Agent Skills',
              'AI Coding',
              'Developer Tools',
              'Data / Analytics'
            ],
            'tags': [
              'architecture', 'system-map', 'agent-skill', 'diagram', 'visualization',
              'workflow', 'sequence-diagram', 'data-flow', 'lifecycle', 'architecture-delta',
              'codebase-analysis', 'typed-json-ir', 'html', 'svg', 'png', 'codex',
              'claude-code', 'cursor', 'opencode'
            ],
            'summary': '把程式碼庫或系統描述轉成可驗證、可互動的系統架構圖的 Agent Skill / Node.js 工具。支援 Architecture、Workflow、Sequence、Data Flow、Lifecycle 五種圖型，並以 typed JSON IR 經 deterministic validation 產生可分享的 HTML / SVG / PNG 等輸出。',
            'use_cases': [
              '從現有 Repository 快速建立高階系統架構圖與核心資料流',
              '把系統描述直接轉成 Architecture、Workflow、Sequence 或 Data Flow 圖',
              '在合併前比較兩個已驗證快照的 Before / Delta / After 架構變更',
              '替 Codex、Claude Code、Cursor 或 OpenCode 產生可互動、可分享的技術架構說明'
            ],
            'pricing': 'open-source',
            'open_source': True,
            'license': 'MIT',
            'difficulty': 'intermediate',
            'status': 'active',
            'rating': 5,
            'added_at': '2026-08-30',
            'last_checked': '2026-08-30',
            'notes': 'README 目前標示 stable v2.16.0，支援 Cursor、Claude Code、Codex CLI 與 OpenCode；可從單純文字描述開始，不要求一定要有 Repository。輸出以 typed JSON IR 與驗證規則維持可重現性；MIT License 已由 repository LICENSE 檔確認。'
          }

          resources = resources_doc.setdefault('resources', [])
          if not any(r.get('id') == entry['id'] or r.get('url') == entry['url'] for r in resources):
              resources.append(entry)
          resources_doc['updated_at'] = '2026-08-30'

          icons_doc.setdefault('icons', {})['tt-a1i-archify'] = {
            'url': 'https://github.com/tt-a1i.png?size=256',
            'source': 'github-owner-avatar-256-fallback-no-project-logo'
          }
          icons_doc['updated_at'] = '2026-08-30'

          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(',', ':')) + '\n')
          icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + '\n')
          categories_path.write_text(json.dumps(categories_doc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit catalog update
        run: |
          if git diff --quiet -- data/resources.json data/resource-icons.json data/categories.json; then
            echo 'No catalog change needed.'
            exit 0
          fi
          git config user.name 'qookey-resource-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json data/categories.json
          git commit -m 'Add Archify architecture visualization resource'
          git push origin HEAD:main
