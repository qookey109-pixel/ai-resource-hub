name: Add Favorites UI

on:
  push:
    paths:
      - '.github/workflows/add-favorites-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Add favorites assets and cache bust
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace(
              './css/hero-compact.css?v=20260827-1',
              './css/hero-compact.css?v=20260827-2'
          )

          favorite_css = '  <link rel="stylesheet" href="./css/favorites.css?v=20260827-1" />\n'
          css_anchor = '  <link rel="stylesheet" href="./css/hero-compact.css?v=20260827-2" />\n'
          if favorite_css not in html:
              if css_anchor not in html:
                  raise SystemExit('Hero CSS anchor not found')
              html = html.replace(css_anchor, css_anchor + favorite_css, 1)

          favorite_js = '  <script type="module" src="./js/favorites.js?v=20260827-1"></script>\n'
          app_anchor = '  <script type="module" src="./js/app.js?v=20260827-2"></script>\n'
          if favorite_js not in html:
              if app_anchor not in html:
                  raise SystemExit('app.js anchor not found')
              html = html.replace(app_anchor, app_anchor + favorite_js, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify favorites assets
        shell: bash
        run: |
          set -euo pipefail
          test -f css/favorites.css
          test -f js/favorites.js
          grep -q 'favorites.css?v=20260827-1' index.html
          grep -q 'favorites.js?v=20260827-1' index.html
          grep -q 'hero-compact.css?v=20260827-2' index.html

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m "Integrate personal favorites UI"
          git push origin HEAD:main
