name: Bump Scroll Fix Cache

on:
  push:
    paths:
      - '.github/workflows/bump-scroll-fix-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Bump favorites script cache version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = './js/favorites.js?v=20260827-2'
          new = './js/favorites.js?v=20260827-3'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('favorites.js cache-bust target not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No cache update needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh sticky scroll fix cache"
          git push origin HEAD:main
