name: Ingest walkthrough-me resource

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-walkthrough-me-20260828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add walkthrough-me to catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          resources_path = Path('data/resources.json')
          icons_path = Path('data/resource-icons.json')

          resources_doc = json.loads(resources_path.read_text())
          icons_doc = json.loads(icons_path.read_text())

          entry = {
            'id': 'sirius-walkthrough-me',
            'name': 'Walkthrough Me',
            'type': 'github',
            'url': 'https://github.com/sirius-cc-wu/sirius-skills/tree/main/skills/walkthrough-me',
            'categories': [
              'Agent Skills',
              'AI Coding',
              'Developer Tools',
              'Learning / Documentation'
            ],
            'tags': [
              'agent-skill', 'code-walkthrough', 'pull-request', 'commit', 'diff',
              'branch-diff', 'staged-changes', 'unstaged-changes', 'code-comprehension',
              'change-tour', 'git', 'codex', 'developer-workflow'
            ],
            'summary': 'Sirius Skills 裡的互動式程式變更導覽 Skill，會把 PR、commit、commit range、branch diff 或本機 staged / unstaged 變更整理成依賴順序的幾個邏輯段落，一次解釋一段並等待使用者確認後再繼續。',
            'use_cases': [
              '在正式 Review 前逐步理解他人的 Pull Request 或 Commit',
              '把跨多個檔案與層級的 Diff 整理成依邏輯順序的導覽',
              '逐段查看程式變更並在每段選擇 next、deeper、tests、back 或 skip',
              '區分 staged、unstaged 與 untracked 變更，避免在理解程式時混淆不同來源'
            ],
            'pricing': 'free',
            'open_source': None,
            'license': None,
            'difficulty': 'intermediate',
            'status': 'active',
            'rating': 5,
            'added_at': '2026-08-28',
            'last_checked': '2026-08-28',
            'notes': '定位是 read-only 的 code-change comprehension，不等同正式 correctness/security/performance review，也不會自動核准、commit 或修改 repository。GitHub repository metadata 目前未偵測到 License，因此重用或再散布前需向上游確認授權。'
          }

          resources = resources_doc.setdefault('resources', [])
          if not any(r.get('id') == entry['id'] or r.get('url') == entry['url'] for r in resources):
              resources.append(entry)
          resources_doc['updated_at'] = '2026-08-28'

          icons_doc.setdefault('icons', {})['sirius-walkthrough-me'] = {
            'url': 'https://github.com/sirius-cc-wu.png?size=256',
            'source': 'github-owner-avatar-256-fallback-no-project-logo'
          }
          icons_doc['updated_at'] = '2026-08-28'

          resources_path.write_text(json.dumps(resources_doc, ensure_ascii=False, separators=(',', ':')) + '\n')
          icons_path.write_text(json.dumps(icons_doc, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit catalog update
        run: |
          if git diff --quiet -- data/resources.json data/resource-icons.json; then
            echo 'No catalog change needed.'
            exit 0
          fi
          git config user.name 'qookey-resource-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/resources.json data/resource-icons.json
          git commit -m 'Add walkthrough-me Agent Skill resource'
          git push origin HEAD:main
