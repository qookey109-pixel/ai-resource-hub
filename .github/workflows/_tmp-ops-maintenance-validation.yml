name: Temporary Ops Maintenance Validation

on:
  push:
    branches:
      - ops/resource-health-65-baseline-20260903
    paths:
      - ".github/workflows/_tmp-ops-maintenance-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate catalog structure
        run: python scripts/resource_health.py --validate-only

      - name: Validate resource links
        run: python scripts/resource_links_validate.py

      - name: Validate health expectations
        run: python scripts/resource_health_triage.py --validate-only

      - name: Validate project status consistency
        run: python scripts/project_status_consistency.py

      - name: Validate production monitor fixture
        run: python scripts/production_worker_monitor.py --validate-only

      - name: Exercise production Workers read-only plus one AI semantic request
        run: python scripts/production_worker_monitor.py --timeout 90

      - name: Publish production monitor summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/production-workers/production-worker-monitor.md ]; then
            cat reports/production-workers/production-worker-monitor.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-maintenance-validation-${{ github.run_id }}
          path: reports/production-workers/
          if-no-files-found: warn
          retention-days: 30
