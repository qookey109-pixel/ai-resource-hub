name: Deploy AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-ai-worker.yml"

permissions:
  contents: write

concurrency:
  group: deploy-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Cloudflare Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 deploy --config worker/wrangler.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          url="$(grep -Eo 'https?://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n1 || true)"
          if [ -z "$url" ]; then
            echo "Deployment completed but no workers.dev URL was found in Wrangler output." >&2
            exit 1
          fi
          url="${url%/}"
          echo "base_url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL resolved: $url"

      - name: Verify Worker health
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/health" -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.ok == true and .service == "qookey-ai-resource-recommender"' /tmp/health.json >/dev/null

      - name: Verify recommendation API
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            curl --fail --silent --show-error \
              -H 'content-type: application/json' \
              -H 'origin: https://qookey109-pixel.github.io' \
              --data '{"query":"我要做 AI 短影片"}' \
              "$BASE_URL/api/recommend" -o /tmp/recommend.json || true
            cat /tmp/recommend.json 2>/dev/null || true
            if jq -e '.ok == true and ((.recommendations | length) > 0)' /tmp/recommend.json >/dev/null 2>&1; then
              success=1
              break
            fi
            sleep 3
          done
          if [ "$success" -ne 1 ]; then
            echo "Recommendation API smoke test failed" >&2
            exit 1
          fi

      - name: Activate frontend AI endpoint
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('data/ai-config.json')
          config = {
              'schema_version': '0.1',
              'enabled': True,
              'endpoint': os.environ['BASE_URL'].rstrip('/') + '/api/recommend',
              'updated_at': '2026-08-23',
          }
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit AI activation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ai-config.json; then
            echo "AI endpoint already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-config.json
          git commit -m "Activate deployed AI recommender"
          git push origin HEAD:main
