<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Qookey AI Resource Hub — 收藏、分類、搜尋 AI、Agent、設計、開發與雲端資源。" />
  <meta name="theme-color" content="#fbfbfa" />
  <title>Qookey AI Resource Hub</title>
  <link rel="icon" type="image/svg+xml" href="./assets/qookey-logo.svg?v=__BUILD__" />
  <link rel="stylesheet" href="./css/styles.css?v=__BUILD__" />
</head>
<body>
  <div id="sliced-waves-background" aria-hidden="true"></div>
  <a class="skip-link" href="#resources">跳到資源列表</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Qookey AI Resource Hub 首頁">
        <img class="brand-logo" src="./assets/qookey-logo.svg?v=__BUILD__" alt="" width="36" height="36" />
        <strong>Qookey</strong>
      </a>
      <nav class="header-actions" aria-label="主要導覽">
        <a class="header-button" href="https://github.com/qookey109-pixel/ai-resource-hub" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="header-button primary" href="#resources">開始探索</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero-section" aria-labelledby="hero-title">
      <div class="hero-inner">
        <h1 id="hero-title">Qookey AI — 資源市場</h1>
        <p class="subtitle">把好用的 AI、GitHub、Agent Skills、設計與開發工具整理到同一個地方。</p>

        <section class="hero-search" aria-label="資源搜尋與排序">
          <div class="hero-search-row">
            <div class="hero-search-box">
              <label class="sr-only" for="search">搜尋資源</label>
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="search" type="search" placeholder="搜尋資源、分類、用途、Demo 或文件…" autocomplete="off" enterkeyhint="search" />
            </div>
            <div class="hero-sort-buttons" aria-label="資源排序">
              <button id="sort-added-button" class="hero-sort-button is-active" type="button" aria-pressed="true" aria-label="加入日期：新到舊">
                <span>加入日期</span>
                <strong data-sort-direction>新→舊</strong>
              </button>
              <button id="sort-clicks-button" class="hero-sort-button" type="button" aria-pressed="false" aria-label="點擊次數：多到少">
                <span>點擊次數</span>
                <strong data-sort-direction>多→少</strong>
              </button>
            </div>
            <select id="sort-filter" hidden aria-hidden="true" tabindex="-1">
              <option value="newest" selected>加入日期：新 → 舊</option>
              <option value="oldest">加入日期：舊 → 新</option>
              <option value="clicks-desc">點擊次數：多 → 少</option>
              <option value="clicks-asc">點擊次數：少 → 多</option>
            </select>
          </div>
        </section>
      </div>
    </section>

    <section id="market-toolbar" class="market-toolbar" aria-label="資源導覽工具列">
      <div class="toolbar-inner">
        <div class="compact-search-wrap" aria-hidden="true">
          <span class="compact-search-icon" aria-hidden="true">⌕</span>
          <label class="sr-only" for="compact-search">搜尋資源</label>
          <input id="compact-search" type="search" placeholder="搜尋資源、分類、Demo 或文件…" autocomplete="off" tabindex="-1" enterkeyhint="search" />
        </div>
        <div id="quick-categories" class="quick-categories" aria-label="資源分類"></div>
      </div>
    </section>

    <section class="catalog-shell" id="resources">
      <div class="catalog-head">
        <div class="catalog-summary">
          <strong id="result-count">0</strong>
          <span>個資源</span>
          <span class="summary-separator">·</span>
          <span><strong id="category-stat">0</strong> 個分類</span>
          <span class="summary-separator">·</span>
          <span><strong id="open-stat">0</strong> 個開源</span>
          <span id="total-stat" class="sr-only">0</span>
        </div>

        <div class="catalog-filters">
          <label><span class="sr-only">分類</span><select id="category-filter"><option value="">全部分類</option></select></label>
          <label><span class="sr-only">資源類型</span><select id="type-filter"><option value="">全部類型</option></select></label>
          <label class="check"><input id="free-filter" type="checkbox" /> 免費 / 開源</label>
          <label class="check"><input id="open-source-filter" type="checkbox" /> 僅開源</label>
          <button id="reset-filters" class="reset" type="button">清除</button>
        </div>
      </div>

      <p id="resource-search-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <section id="resource-grid" class="grid" aria-label="資源列表"></section>
      <section id="empty-state" class="empty" hidden>
        <div class="empty-icon">⌕</div>
        <h2>找不到符合的資源</h2>
        <p>試試較短的關鍵字、其他分類名稱或用途。</p>
      </section>
    </section>
  </main>

  <footer class="footer">
    <strong>Qookey AI Resource Hub</strong>
    <span>持續整理 · 持續更新</span>
  </footer>

  <template id="resource-template">
    <article class="card">
      <div class="card-heading">
        <div class="resource-icon" aria-hidden="true"></div>
        <div class="card-title-wrap">
          <h2 class="name"></h2>
          <div class="byline"><span class="type"></span><span class="primary-category"></span></div>
        </div>
      </div>
      <p class="description"></p>
      <p class="use-case"></p>
      <div class="categories"></div>
      <div class="card-footer">
        <div class="resource-facts"><span class="meta"></span><span class="rating"></span></div>
        <div class="card-actions">
          <a class="visit" target="_blank" rel="noopener noreferrer">開啟 ↗</a>
        </div>
      </div>
    </article>
  </template>

  <dialog id="resource-detail-dialog" class="resource-detail-dialog" aria-labelledby="resource-detail-title" aria-describedby="resource-detail-summary">
    <div class="resource-detail-shell">
      <header class="resource-detail-hero">
        <div class="resource-detail-icon" aria-hidden="true"></div>
        <div class="resource-detail-heading">
          <p class="resource-detail-kicker"></p>
          <h2 id="resource-detail-title" class="resource-detail-title"></h2>
          <p id="resource-detail-summary" class="resource-detail-summary"></p>
        </div>
        <button class="resource-detail-close" type="button" data-detail-close aria-label="關閉詳細資訊">×</button>
      </header>

      <div class="resource-detail-body">
        <div class="resource-detail-main">
          <section class="resource-detail-section">
            <h3>適合用途</h3>
            <ul class="resource-detail-use-cases"></ul>
          </section>

          <section class="resource-detail-section" data-detail-section="notes">
            <h3>補充與使用提醒</h3>
            <p class="resource-detail-notes"></p>
          </section>
        </div>

        <aside class="resource-detail-side" aria-label="資源資訊">
          <section class="resource-detail-section">
            <h3>資源資訊</h3>
            <dl class="resource-detail-facts"></dl>
          </section>

          <section class="resource-detail-section" data-detail-section="links" hidden>
            <h3>官方與相關連結</h3>
            <div class="resource-detail-links"></div>
          </section>

          <section class="resource-detail-section" data-detail-section="categories">
            <h3>分類</h3>
            <div class="resource-detail-pills"></div>
          </section>

          <section class="resource-detail-section" data-detail-section="tags">
            <h3>關鍵字</h3>
            <div class="resource-detail-tags"></div>
          </section>
        </aside>
      </div>

      <footer class="resource-detail-footer">
        <button class="resource-detail-secondary" type="button" data-detail-close>返回列表</button>
        <button class="resource-detail-share" type="button">複製連結</button>
        <a class="resource-detail-visit" target="_blank" rel="noopener noreferrer">前往資源 ↗</a>
      </footer>
    </div>
  </dialog>

  <script type="module" src="./js/sliced-waves-background.js?v=__BUILD__"></script>
  <script type="module" src="./js/icon-reliability.js?v=__BUILD__"></script>
  <script type="module" src="./js/app.js?v=__BUILD__"></script>
  <script type="module" src="./js/favorites.js?v=__BUILD__"></script>
  <script type="module" src="./js/resource-detail.js?v=__BUILD__"></script>
  <script type="module" src="./js/resource-links.js?v=__BUILD__"></script>
</body>
</html>
