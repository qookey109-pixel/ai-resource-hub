<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a10" />
  <title>Qookey Gesture HUD</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a10}
    #hud{position:fixed;inset:0;width:100%;height:100%;border:0;background:#060a10}
  </style>
</head>
<body>
  <iframe id="hud" src="./base-v1.html" title="Qookey Gesture HUD" allow="camera; fullscreen"></iframe>
  <script>
    const frame = document.getElementById('hud');
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const app = doc.querySelector('.app');
      if (!win || !doc || !app) return;

      const canvas = doc.createElement('canvas');
      canvas.id = 'abstractOrbStage';
      Object.assign(canvas.style, { position:'absolute', inset:'0', width:'100%', height:'100%', zIndex:'2', pointerEvents:'none' });
      const scanlines = doc.querySelector('.scanlines');
      app.insertBefore(canvas, scanlines || app.firstChild);

      const caption = doc.createElement('div');
      caption.innerHTML = '<b>ABSTRACT CORE</b><span>張開手掌讓球體展開</span>';
      Object.assign(caption.style, { position:'absolute', left:'50%', top:'50%', transform:'translate(-50%, 112px)', zIndex:'3', pointerEvents:'none', textAlign:'center', textTransform:'uppercase', letterSpacing:'.18em', color:'rgba(235,251,255,.48)', fontSize:'10px', textShadow:'0 0 18px rgba(139,240,255,.34)' });
      caption.querySelector('b').style.cssText = 'display:block;margin-bottom:5px;color:rgba(235,251,255,.82);font-size:11px;letter-spacing:.22em';
      app.insertBefore(caption, scanlines || app.firstChild);

      const chips = doc.querySelector('.chips');
      let orbState = null;
      if (chips) {
        const chip = doc.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = 'Orb <b id="orbStateV2">CLOSED</b>';
        chips.appendChild(chip);
        orbState = chip.querySelector('b');
      }

      const kv = doc.querySelector('#panelB .kv');
      let opennessText = null;
      if (kv) {
        const label = doc.createElement('span'); label.textContent = 'Sphere openness';
        opennessText = doc.createElement('b'); opennessText.textContent = '15%';
        kv.append(label, opennessText);
      }

      const hint = doc.querySelector('.hint');
      if (hint) hint.textContent = '張開手掌展開抽象球體 · 握拳收合 · 食指移動游標 · 捏合抓取面板';
      const intro = doc.querySelector('.start-card p');
      if (intro) intro.textContent = '啟動相機後，網站會在裝置上追蹤手部關節。張開手掌會讓中央抽象球體展開，握拳會收合；食指仍可當游標，拇指＋食指捏合可拖曳 HUD 面板。';

      const ctx = canvas.getContext('2d');
      const count = 360;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const particles = Array.from({length:count}, (_, i) => {
        const y = 1 - (i / (count - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y*y));
        const theta = goldenAngle * i;
        return { x:Math.cos(theta)*r, y, z:Math.sin(theta)*r, phase:(i*.61803398875)%1, shard:i%7 };
      });

      let open = .15, target = .15, rotation = 0, demo = false;
      const gestureEl = doc.getElementById('gestureText');
      const handsEl = doc.getElementById('hands');
      const cursor = doc.getElementById('cursor');
      doc.getElementById('demoBtn')?.addEventListener('click', () => { demo = true; target = 1; });
      doc.getElementById('startBtn')?.addEventListener('click', () => { demo = false; });

      function resize() {
        const dpr = Math.min(win.devicePixelRatio || 1, 2);
        canvas.width = Math.round(win.innerWidth * dpr);
        canvas.height = Math.round(win.innerHeight * dpr);
        canvas.style.width = win.innerWidth + 'px';
        canvas.style.height = win.innerHeight + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      win.addEventListener('resize', resize); resize();

      function gestureTarget() {
        if (demo) return 1;
        const hands = Number(handsEl?.textContent || 0);
        if (!hands) return .15;
        const g = gestureEl?.textContent || '—';
        if (g === 'OPEN') return 1;
        if (g === 'FIST') return .02;
        if (g === 'PINCH') return .08;
        if (g === 'POINT') return .3;
        if (g === 'SWIPE') return .68;
        return .48;
      }

      function cursorInfluence() {
        const x = parseFloat(cursor?.style.left || '') / Math.max(1, win.innerWidth);
        const y = parseFloat(cursor?.style.top || '') / Math.max(1, win.innerHeight);
        return { x:Number.isFinite(x)?x:.5, y:Number.isFinite(y)?y:.5 };
      }

      function draw(now) {
        target = gestureTarget();
        open += (target-open)*.075;
        rotation += .0022 + open*.0026;
        const w = win.innerWidth, h = win.innerHeight;
        ctx.clearRect(0,0,w,h);
        const hand = cursorInfluence();
        const cx = w*.5 + (hand.x-.5)*34*open;
        const cy = h*.49 + (hand.y-.5)*22*open;
        const base = Math.max(54, Math.min(108, Math.min(w,h)*.105));
        const radius = base*(.78 + open*.68);
        const pulse = 1 + Math.sin(now*.0022)*.025;

        const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,radius*1.5);
        glow.addColorStop(0, `rgba(220,253,255,${.17+open*.15})`);
        glow.addColorStop(.28, `rgba(139,240,255,${.12+open*.09})`);
        glow.addColorStop(.68, `rgba(95,120,255,${.045+open*.045})`);
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx,cy,radius*1.5,0,Math.PI*2); ctx.fill();

        ctx.save(); ctx.translate(cx,cy); ctx.rotate((hand.x-.5)*.16);
        for (let ring=0; ring<3; ring++) {
          const scale = 1 + ring*.22 + open*(.28+ring*.08);
          ctx.beginPath();
          ctx.ellipse(0,0,radius*scale,radius*(.28+ring*.08),rotation*(ring%2?-1:1)+ring*.7,0,Math.PI*2);
          ctx.strokeStyle = `rgba(139,240,255,${.08+open*.11-ring*.018})`; ctx.lineWidth=1; ctx.stroke();
        }
        ctx.restore();

        const cosY=Math.cos(rotation), sinY=Math.sin(rotation);
        const tilt=(hand.y-.5)*.5 + Math.sin(now*.0007)*.08;
        const cosX=Math.cos(tilt), sinX=Math.sin(tilt);
        const points=[];
        for (const p of particles) {
          const rx=p.x*cosY-p.z*sinY;
          let rz=p.x*sinY+p.z*cosY;
          const ry=p.y*cosX-rz*sinX;
          rz=p.y*sinX+rz*cosX;
          const a=(p.shard/7)*Math.PI*2;
          const petal=1+open*(.34+.12*Math.sin(a+now*.0014));
          const splitX=Math.cos(a)*open*base*.16*Math.abs(ry);
          const splitY=Math.sin(a)*open*base*.11*Math.abs(rx);
          const px=rx*radius*petal*pulse+splitX;
          const py=ry*radius*(1+open*.28)*pulse+splitY+Math.sign(ry)*open*base*.12*Math.pow(Math.abs(ry),.55);
          const perspective=1+rz*.18;
          points.push({x:cx+px*perspective,y:cy+py*perspective,z:rz,phase:p.phase});
        }
        points.sort((a,b)=>a.z-b.z);
        for (const p of points) {
          const depth=(p.z+1)*.5;
          const sparkle=.72+Math.sin(now*.003+p.phase*18)*.28;
          const size=.7+depth*1.55+open*.42;
          ctx.beginPath(); ctx.arc(p.x,p.y,size,0,Math.PI*2);
          ctx.fillStyle=`rgba(${Math.round(165+depth*78)},${Math.round(224+depth*28)},255,${(.22+depth*.58)*sparkle})`; ctx.fill();
        }

        ctx.beginPath(); ctx.arc(cx,cy,5+open*5,0,Math.PI*2);
        ctx.fillStyle=`rgba(235,253,255,${.72+open*.2})`; ctx.shadowColor='rgba(139,240,255,.95)'; ctx.shadowBlur=24+open*30; ctx.fill(); ctx.shadowBlur=0;

        const pct=Math.round(open*100);
        if (opennessText) opennessText.textContent=pct+'%';
        if (orbState) orbState.textContent=pct>82?'EXPANDED':pct<16?'CLOSED':'OPEN '+pct+'%';
        caption.style.opacity=String(.4+open*.6);
        win.requestAnimationFrame(draw);
      }
      win.requestAnimationFrame(draw);
    });
  </script>
</body>
</html>
